<meta charset="utf-8">
<title>CBAM Installation Blueprint</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap");

:root {
  --paper:#F4F1EA; --ink:#1F1C19; --ink-mid:#57524B; --ink-light:#97918A;
  --rule:#DAD6CD; --panel:#FBF9F5;
  --struct:#9EA29D; --struct-fill:#EAE7DF;
  --carbon:#8A7746; --boundary:#2F4858; --signal:#A8321C; --ok:#3F6B52;
  --t1:#A8321C; --t2:#8A6410; --t3:#6A6A72;
  --select:#0A93B4; --select-soft:rgba(10,147,180,.16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#15161A; --ink:#E9E5DD; --ink-mid:#A29D94; --ink-light:#6B6760;
    --rule:#2C2F34; --panel:#1B1D21;
    --struct:#767B80; --struct-fill:#1D1F23;
    --carbon:#C6A968; --boundary:#7FA8BF; --signal:#E4674A; --ok:#6FAE8B;
    --t1:#E4674A; --t2:#D2A94E; --t3:#9A9AA4;
    --select:#36D3F2; --select-soft:rgba(54,211,242,.18);
  }
}
:root[data-theme="dark"] {
  --paper:#15161A; --ink:#E9E5DD; --ink-mid:#A29D94; --ink-light:#6B6760;
  --rule:#2C2F34; --panel:#1B1D21;
  --struct:#767B80; --struct-fill:#1D1F23;
  --carbon:#C6A968; --boundary:#7FA8BF; --signal:#E4674A; --ok:#6FAE8B;
  --t1:#E4674A; --t2:#D2A94E; --t3:#9A9AA4;
  --select:#36D3F2; --select-soft:rgba(54,211,242,.18);
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink);
  font:13.5px/1.5 "IBM Plex Sans Condensed","Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
}
:focus-visible { outline:2px solid var(--select); outline-offset:2px; }

header {
  display:flex; align-items:center; gap:14px;
  padding:8px 16px; border-bottom:1px solid var(--rule); background:var(--panel);
}
.spacer { flex:1; }
.zoom { display:flex; align-items:center; gap:3px; }
.zoom button, .filebtn {
  border:1px solid var(--rule); background:var(--paper); color:var(--ink-mid);
  border-radius:2px; padding:5px 10px; cursor:pointer;
  font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.03em;
}
.zoom button:hover, .filebtn:hover { border-color:var(--signal); color:var(--signal); }
#zoom-level { font:11px "IBM Plex Mono",monospace; color:var(--ink-light); min-width:42px; text-align:center; }
#file { display:none; }
.views { display:flex; gap:3px; }
.iconbtn {
  border:1px solid var(--rule); background:var(--paper); color:var(--ink-light);
  border-radius:2px; width:29px; height:26px; padding:0; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.iconbtn svg { fill:none; stroke:currentColor; stroke-width:1.2; }
.iconbtn:hover { border-color:var(--signal); color:var(--signal); }
.iconbtn[aria-pressed="true"] { color:var(--ink); border-color:var(--ink-light); background:var(--struct-fill); }
body.hide-aside #side { display:none; }
body.hide-streams #streams { display:none; }

/* The page is one scrolling document. The side panel sticks; the stream table pins to the
   bottom of the viewport so it never has to be scrolled to. */
main { display:grid; grid-template-columns:var(--plan-w) minmax(0,1fr) var(--side-w); align-items:start; }
body.hide-plan main { grid-template-columns:minmax(0,1fr) var(--side-w); }
body.hide-aside main { grid-template-columns:var(--plan-w) minmax(0,1fr); }
body.hide-plan.hide-aside main { grid-template-columns:minmax(0,1fr); }
body.hide-plan #plan { display:none; }
@media (max-width:1080px) { main { grid-template-columns:1fr !important; } }
.left { min-width:0; }

#plan, #side { position:sticky; top:0; max-height:100vh; display:flex; background:var(--panel); min-width:0; }
#plan { border-right:1px solid var(--rule); }
#side { border-left:1px solid var(--rule); flex-direction:row-reverse; }
.panel-inner { flex:1 1 auto; min-width:0; overflow-y:auto; max-height:100vh; }
.vgrip { flex:0 0 7px; cursor:ew-resize; background:var(--rule); touch-action:none; }
.vgrip:hover, .vgrip.dragging { background:var(--ink-light); }
#plan section { padding:12px 16px; }
.plan-head { border-bottom:1px solid var(--rule); }
.plan-title { font:600 17px/1.2 "IBM Plex Serif",Georgia,serif; letter-spacing:0; text-transform:none; color:var(--ink); margin:0; }
/* the two documents on the table, as tabs of one panel */
.doc-tabs { display:flex; gap:0; border-bottom:1px solid var(--rule); margin:0 -16px; padding:0 16px; }
.doctab { flex:1 1 auto; cursor:pointer; padding:6px 4px 8px; border:0; border-bottom:2px solid transparent; background:none; text-align:left;
  color:var(--ink-light); font:600 15px/1.2 "IBM Plex Serif",Georgia,serif; display:flex; flex-direction:column; gap:2px; }
.doctab .dt-sub { font:10px "IBM Plex Mono",monospace; color:var(--ink-light); letter-spacing:.04em; }
.doctab:hover { color:var(--ink-mid); }
.doctab[aria-pressed="true"] { color:var(--ink); border-bottom-color:var(--select); }
.doctab[aria-pressed="true"] .dt-sub { color:var(--ink-mid); }
.doctab.none { font-style:italic; }
body.period-view #plan-src { display:none; }
.ptable { width:100%; border-collapse:collapse; font:11px "IBM Plex Sans Condensed",sans-serif; margin:4px 0 2px; }
.ptable th { text-align:left; font:600 9px "IBM Plex Mono",monospace; letter-spacing:.06em; color:var(--ink-light); padding:2px 5px; border-bottom:1px solid var(--rule); white-space:nowrap; }
.ptable td { padding:3px 5px; border-bottom:1px solid var(--rule); vertical-align:top; color:var(--ink-mid); }
.ptable td.n, .ptable th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.ptable tr[data-plan-node] { cursor:pointer; }
.ptable tr[data-plan-node]:hover td { background:var(--struct-fill); }
.ptable tr.active td { background:var(--select-soft); }
.ptable td b { color:var(--ink); font-weight:600; }
.ptable .cellref { font:9px "IBM Plex Mono",monospace; color:var(--ink-light); }
.clause dl.kv { margin:2px 0 4px; display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:11.5px; }
.clause dl.kv dt { color:var(--ink-light); }
.clause dl.kv dd { margin:0; color:var(--ink-mid); }
.clause dl.kv dd b { color:var(--ink); font-weight:600; }
.pp-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.pp-tabs:empty { display:none; }
.pptab { flex:1 1 auto; min-width:0; text-align:left; cursor:pointer; padding:6px 9px; border:1px solid var(--rule); border-radius:2px;
  background:var(--panel); color:var(--ink-mid); font:12px "IBM Plex Sans Condensed",sans-serif; display:flex; flex-direction:column; gap:2px; }
.pptab:hover { border-color:var(--ink-light); color:var(--ink); }
.pptab[aria-pressed="true"] { border-color:var(--select); background:var(--select-soft); color:var(--ink); box-shadow:inset 2px 0 0 var(--select); }
.pptab .pp-n { font-weight:600; }
.pptab .pp-cn { font:10px "IBM Plex Mono",monospace; color:var(--ink-mid); }
#diagram .pp-dim { opacity:.16; }
#streams tr.pp-dim { opacity:.35; }
.plan-src { border-bottom:1px solid var(--rule); padding:10px 16px !important; }
.src-head { display:flex; align-items:center; gap:10px; }
.src-status { font:11px "IBM Plex Sans Condensed",sans-serif; color:var(--ink-mid); min-width:0; }
.src-status.err { color:var(--signal); }
.src-status.busy { color:var(--select); }
.srcbtn { cursor:pointer; padding:4px 9px; border:1px solid var(--rule); border-radius:2px; background:var(--panel); color:var(--ink-mid);
  font:600 10px "IBM Plex Sans Condensed",sans-serif; letter-spacing:.08em; }
.srcbtn:hover { border-color:var(--ink-light); color:var(--ink); }
.srcbtn.primary { border-color:var(--select); color:var(--select); }
.srcbtn.primary:hover { background:var(--select-soft); }
.srcbtn[aria-expanded="true"] { background:var(--select-soft); color:var(--ink); border-color:var(--select); }
.src-body { margin-top:8px; }
#src-text { width:100%; box-sizing:border-box; height:180px; resize:vertical; border:1px solid var(--rule); border-radius:2px;
  background:var(--paper); color:var(--ink); font:11.5px/1.45 "IBM Plex Mono",monospace; padding:8px; }
#src-text:focus { outline:none; border-color:var(--select); }
.src-actions { display:flex; gap:6px; margin-top:6px; }
.clause .q { display:block; margin-top:3px; font:italic 11px/1.35 "IBM Plex Serif",Georgia,serif; color:var(--ink-light); }
.clause .q code { font-style:normal; font-size:9.5px; margin-right:4px; }
#detail dd .quote { font:italic 12px/1.4 "IBM Plex Serif",Georgia,serif; color:var(--ink-mid); }
.clause { border-bottom:1px solid var(--rule); }
.clause h3 { margin:0 0 7px; font:600 12.5px "IBM Plex Serif",Georgia,serif; }
.clause .ref { text-align:right; margin-top:4px; font:9.5px "IBM Plex Mono",monospace; color:var(--ink-light); }
.clause p { margin:0 0 6px; font-size:12px; color:var(--ink-mid); }
.clause ul { list-style:none; margin:0; padding:0; }
.clause li { padding:6px 8px; margin:0 -8px 2px; border-radius:2px; cursor:pointer; font-size:12px; }
.clause li:hover { background:var(--struct-fill); }
.clause li.active { background:var(--select-soft); box-shadow:inset 2px 0 0 var(--select); }
.clause li b { font-weight:600; color:var(--ink); }
.clause li .k { color:var(--ink-mid); }
.clause li .gapword { color:var(--signal); font-style:italic; }
.clause .sub { font:600 9.5px "IBM Plex Sans Condensed",sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-light); margin:9px 0 4px; }
.clause .tagm { font:10.5px "IBM Plex Mono",monospace; color:var(--ink-mid); }
#diagram { overflow-x:auto; padding:14px 0 10px 14px; }
:root { --streams-h:236px; --plan-w:344px; --side-w:396px; }
body:not(.hide-streams) .left { padding-bottom:var(--streams-h); }
#streams {
  position:fixed; left:var(--plan-w); right:var(--side-w); bottom:0; height:var(--streams-h); z-index:5;
  display:flex; flex-direction:column;
  border-top:1px solid var(--rule); background:var(--panel);
}
#streams-grip { flex:0 0 7px; cursor:ns-resize; background:var(--rule); touch-action:none; }
#streams-grip:hover, #streams-grip.dragging { background:var(--ink-light); }
#streams-body { flex:1 1 auto; overflow:auto; min-height:0; }
body.hide-aside #streams { right:0; }
body.hide-plan #streams { left:0; }
@media (max-width:1080px) { #streams { right:0; left:0; } }
section { padding:14px 18px; border-bottom:1px solid var(--rule); }
section h2 { margin:0 0 9px; font:600 10px/1 "IBM Plex Sans Condensed",sans-serif;
             letter-spacing:.14em; text-transform:uppercase; color:var(--ink-light); }

#summary { display:flex; gap:6px; flex-wrap:wrap; }
.pill { font:500 10px/1 "IBM Plex Mono",monospace; letter-spacing:.06em;
        padding:5px 8px; border:1px solid currentColor; border-radius:2px; display:flex; gap:6px; }
.pill b { font-weight:600; }
.p1 { color:var(--t1); } .p2 { color:var(--t2); } .p3 { color:var(--t3); }

#findings { list-style:none; margin:0; padding:0; }
.finding { padding:10px 11px; border:1px solid var(--rule); border-left-width:3px;
           margin-bottom:7px; cursor:pointer; background:var(--paper); }
.finding:hover { border-color:var(--ink-light); }
.finding.active { border-color:var(--select); background:var(--select-soft); }
.finding.tier-1 { border-left-color:var(--t1); } .finding.tier-1 .f-rank { color:var(--t1); }
.finding.tier-2 { border-left-color:var(--t2); } .finding.tier-2 .f-rank { color:var(--t2); }
.finding.tier-3 { border-left-color:var(--t3); } .finding.tier-3 .f-rank { color:var(--t3); }
.f-top { display:flex; gap:8px; align-items:baseline; margin-bottom:3px; }
.f-id { font:600 10.5px "IBM Plex Mono",monospace; color:var(--ink-light); }
.f-rank { font:600 9.5px "IBM Plex Mono",monospace; letter-spacing:.1em; }
.f-title { font-weight:600; font-size:13px; margin-bottom:3px; }
.f-detail { color:var(--ink-mid); font-size:12px; }
.f-refs { margin-top:5px; }
code { font:10.5px "IBM Plex Mono",monospace; color:var(--ink-mid);
       border:1px solid var(--rule); border-radius:2px; padding:1px 4px; }

#detail h3 { margin:0 0 9px; font:600 14px "IBM Plex Serif",Georgia,serif; }
#detail dl { display:grid; grid-template-columns:112px 1fr; gap:4px 12px; margin:0; font-size:12px; }
#detail dt { color:var(--ink-light); }
#detail dd { margin:0; overflow-wrap:anywhere; }
.hint { color:var(--ink-mid); font-size:12px; margin:0; }

#streams table { width:100%; border-collapse:collapse; font-size:11.5px; }
#streams th { position:sticky; top:0; background:var(--panel); text-align:left;
  font:600 9.5px "IBM Plex Sans Condensed",sans-serif; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-light); padding:8px 10px; border-bottom:1px solid var(--rule); }
#streams td { padding:4px 10px; border-bottom:1px solid var(--rule); }
#streams tr { cursor:pointer; }
#streams tbody tr:hover { background:var(--struct-fill); }
#streams tr.active { background:var(--select-soft); box-shadow:inset 2px 0 0 var(--select); }
#streams .mono { font-family:"IBM Plex Mono",monospace; }
#streams .num { text-align:right; font-family:"IBM Plex Mono",monospace; }
#streams .dim { color:var(--ink-mid); }
.nd-cell { color:var(--signal); font-style:italic; }

/* ---------- the sheet ---------- */
svg { display:block; }
.frame { fill:none; stroke:var(--rule); stroke-width:1; }
.halo { paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round; }
@media print { .halo { stroke:#fff; } }

.b-head { font:600 8.5px "IBM Plex Mono",monospace; letter-spacing:.14em; fill:var(--ink-light); }
.b-k { font:9.5px "IBM Plex Sans Condensed",sans-serif; fill:var(--ink-light); }
.b-v { font:9.5px "IBM Plex Mono",monospace; fill:var(--ink-mid); }

/* long-dash-dot chain line: the drafting convention for a boundary */
.boundary rect { fill:none; stroke:var(--boundary); stroke-width:1; stroke-dasharray:16 3 2 3; opacity:.85; }
.boundary text { font:600 8.5px "IBM Plex Mono",monospace; letter-spacing:.12em;
                 fill:var(--boundary); text-transform:uppercase; }
.boundary .b-ref { text-anchor:end; opacity:.7; letter-spacing:.06em; }

/* flows: a wash inside a contour, never colour alone */
.ribbon { fill:var(--carbon); fill-opacity:.26; stroke:var(--carbon); stroke-width:.6; stroke-opacity:.65; }
.ribbon.rb-electricity { fill-opacity:.10; stroke-dasharray:4 3; }
.ribbon.rb-co2, .ribbon.rb-flue_gas { fill-opacity:.18; }
.ribbon.rb-gap { fill:url(#hatch-gap); fill-opacity:1; stroke:var(--signal); stroke-width:.9; stroke-dasharray:5 3; }
.ribbon.lit { fill:var(--select); fill-opacity:.45; stroke:var(--select); stroke-width:1.4; }
.hx-gap { stroke:var(--signal); stroke-width:1; opacity:.5; }
.hx-cut { stroke:var(--struct); stroke-width:.7; opacity:.85; }
.cline { fill:none; stroke:var(--carbon); stroke-width:.5; opacity:.5; }
.cline.cl-gap { stroke:var(--signal); opacity:.75; }
.ar { fill:var(--carbon); opacity:.7; }

/* equipment: unfilled outline silhouettes, three-tier line weights (ISO 10628 5.3.1) */
.s-body { fill:var(--struct-fill); stroke:var(--struct); stroke-width:1; stroke-linejoin:round; }
.s-detail { fill:none; stroke:var(--struct); stroke-width:.5; }
.s-hatch-fill { fill:url(#hatch-cut); stroke:var(--struct); stroke-width:.5; }
.hit { fill:transparent; }
.node { cursor:pointer; }
.node:hover .s-body { stroke:var(--ink-mid); stroke-width:1.4; }
.node.lit .s-body, .node.lit .g-flag, .node.lit .r-pile, .node.lit .t-ring { stroke:var(--select); stroke-width:2.4; }
.node.lit .nm, .node.lit .nm-r, .node.lit .nm-in { fill:var(--select); }
.node.lit .t-half { fill:var(--select); }
.nd-context .s-body, .nd-context .t-ring { stroke-dasharray:3 3; opacity:.55; }
.nd-context text { opacity:.55; }

.tag { font:500 9px "IBM Plex Mono",monospace; fill:var(--ink-mid); text-anchor:middle; letter-spacing:.04em; }
.nm { font:500 10.5px "IBM Plex Sans Condensed",sans-serif; fill:var(--ink); text-anchor:middle;
      text-transform:uppercase; letter-spacing:.055em; }
.nm-r { font:500 10.5px "IBM Plex Sans Condensed",sans-serif; fill:var(--ink); text-anchor:end;
        text-transform:uppercase; letter-spacing:.055em; }
.nm-in { font:500 10.5px "IBM Plex Sans Condensed",sans-serif; fill:var(--ink);
         text-transform:uppercase; letter-spacing:.055em; }
.cn { font:9.5px "IBM Plex Mono",monospace; fill:var(--ink-light); }

.t-ring { fill:var(--paper); stroke:var(--ink-mid); stroke-width:1; }
.t-half { fill:var(--ink-mid); }
.g-flag { fill:none; stroke:var(--ok); stroke-width:1.4; }
.r-pile { fill:var(--struct-fill); stroke:var(--ink-mid); stroke-width:1; }

.flag path { fill:var(--paper); stroke:var(--ink-mid); stroke-width:.7; }
.flag text { font:500 8.5px "IBM Plex Mono",monospace; fill:var(--ink-mid); text-anchor:middle; }
.bub circle { fill:var(--paper); stroke:var(--ink-mid); stroke-width:.9; }
.bub text { font:600 7px "IBM Plex Mono",monospace; fill:var(--ink); text-anchor:middle; letter-spacing:.02em; }
.bub .bt { font-weight:400; font-size:6px; fill:var(--ink-light); }
.nd rect { fill:var(--paper); stroke:var(--signal); stroke-width:1; }
.nd text { font:600 8px "IBM Plex Mono",monospace; fill:var(--signal); text-anchor:middle; letter-spacing:.08em; }

.ua-rb { fill:url(#hatch-gap); stroke:var(--signal); stroke-width:.9; stroke-dasharray:5 3; }
.ua-tag rect { fill:var(--paper); stroke:var(--signal); stroke-width:.9; }
.ua-tag text { font:600 8px "IBM Plex Mono",monospace; fill:var(--signal); letter-spacing:.07em; }

/* findings: straight off-grid leaders; hexagon, because a circle means instrument bubble */
.find { cursor:pointer; }
.ldr-halo { stroke:var(--paper); stroke-width:3.4; fill:none; }
.ldr { stroke:currentColor; stroke-width:.7; fill:none; }
.hexh { fill:var(--paper); stroke:var(--paper); stroke-width:3.4; }
.hex { fill:currentColor; stroke:none; }
.find text { font:600 9.5px "IBM Plex Mono",monospace; fill:var(--paper); text-anchor:middle; }
.find.tier-1 { color:var(--t1); } .find.tier-2 { color:var(--t2); } .find.tier-3 { color:var(--t3); }
.find.lit .hex { stroke:var(--select); stroke-width:2.2; }
.find.lit .ldr { stroke:var(--select); stroke-width:1.6; }

.titleblock rect { fill:var(--panel); stroke:var(--ink-mid); stroke-width:1; }
.titleblock line { stroke:var(--ink-mid); stroke-width:.5; }
.titleblock .t-name { font:600 11px "IBM Plex Serif",Georgia,serif; fill:var(--ink); }
.titleblock .t-k { font:600 7.5px "IBM Plex Mono",monospace; letter-spacing:.1em; fill:var(--ink-light); }
.titleblock .t-v { font:600 9px "IBM Plex Mono",monospace; fill:var(--ink); }
.titleblock .t-note { font:italic 8.5px "IBM Plex Serif",Georgia,serif; fill:var(--ink-mid); }
.titleblock .t-big { font:600 22px "IBM Plex Mono",monospace; fill:var(--ink); }

/* ---------- the documents on the table ---------- */
.docs { display:flex; gap:10px; align-items:center; font:500 10px "IBM Plex Mono",monospace; letter-spacing:.04em; color:var(--ink); }
.docs .doc { display:inline-flex; align-items:center; gap:6px; padding:3px 0; border-bottom:1px solid var(--rule); }
.docs .doc.none { color:var(--ink-light); border-bottom-style:dashed; }
.docs .dk { font-weight:600; font-size:8px; letter-spacing:.14em; color:var(--ink-light); }

/* ---------- the drawing set ---------- */
.sheets { display:flex; gap:3px; margin-left:8px; }
.sheetbtn { border:1px solid var(--rule); background:var(--paper); color:var(--ink-mid); border-radius:2px; padding:3px 9px 3px 7px;
  cursor:pointer; display:flex; align-items:baseline; gap:7px; font:500 10px "IBM Plex Mono",monospace; letter-spacing:.06em; }
.sheetbtn .sn { font-weight:600; font-size:12px; color:var(--ink-light); }
.sheetbtn:hover { border-color:var(--signal); color:var(--signal); }
.sheetbtn[aria-pressed="true"] { color:var(--ink); border-color:var(--ink-light); background:var(--struct-fill); }
.sheetbtn[aria-pressed="true"] .sn { color:var(--ink); }
.layers { display:flex; gap:2px; margin-left:14px; flex-wrap:wrap; }
.laybtn { border:1px solid var(--rule); background:var(--paper); color:var(--ink-light); border-radius:2px; padding:3px 7px; cursor:pointer;
  font:500 9px "IBM Plex Mono",monospace; letter-spacing:.08em; }
.laybtn[aria-pressed="true"] { color:var(--ink-mid); border-color:var(--ink-light); background:var(--struct-fill); }
.laybtn:hover { border-color:var(--signal); color:var(--signal); }
.laybtn.layall { color:var(--ink-mid); border-color:var(--ink-light); margin-right:4px; min-width:44px; }
.layer-off { display:none; }
#diagram { overflow:hidden; }
#diagram svg { cursor:grab; touch-action:none; user-select:none; }
#diagram svg.dragged { cursor:grabbing; }
#streams tr.off-sheet { opacity:.3; }
#streams tr.hover { background:var(--struct-fill); }

<script>/* Two documents, one drawing.

   A PLAN is one monitoring-plan version: the installation's structure as 2025/2547
   Annex II A.5 describes it. A PERIOD is one reporting period's values, laid out like
   the Commission's communication template and keyed to the plan's ids. The renderers
   and the audit engine read one joined object; joinModel builds it. With no period
   the sheet still draws, at nominal ribbon widths, and only structural checks run. */

function docType(d) {
  if (!d || typeof d !== 'object') return null;
  if (d.document_type === 'plan') return 'plan';
  if (d.document_type === 'period') return 'period';
  if (d.schema_version === '0.1' && d.nodes && d.flows) return 'legacy';
  return null;
}

/* Is this flow's carbon a data gap? Only once a period is loaded: with no period nothing
   is determined yet, and that is not a finding. */
function flowGap(model, f) {
  return !!(model && model.period_loaded) && f.carbon_t == null;
}

function pctToFrac(m) {
  return m && m.value != null ? m.value / 100 : null;
}

function joinModel(plan, period) {
  const m = JSON.parse(JSON.stringify(plan));
  m.document_type = 'joined';
  m.period_loaded = !!period;
  m.period = period || null;
  m.installation = m.installation || {};
  m.installation.monitoring_plan_version = (plan.monitoring_plan || {}).version;
  m.installation.monitoring_plan_date = (plan.monitoring_plan || {}).date;
  if (period) m.installation.reporting_period = period.reporting_period;
  m.instruments = m.instruments || [];
  if (!period) return m;

  const byId = new Map(m.nodes.map(n => [n.id, n]));
  const B = (period.B || {}).source_streams || [];
  for (const r of B) {
    const n = byId.get(r.source_stream_id);
    if (!n) continue;
    n.template_ref = r.template_ref;
    n.activity_data = Object.assign({}, n.activity_data || {},
      { value: r.activity_data ? r.activity_data.value : null },
      r.activity_data && r.activity_data.unit ? { unit: r.activity_data.unit } : {});
    const cf = Object.assign({}, n.calculation_factors || {});
    if (r.emission_factor) { cf.emission_factor = r.emission_factor.value; cf.emission_factor_unit = r.emission_factor.unit; }
    if (r.net_calorific_value) { cf.net_calorific_value = r.net_calorific_value.value; cf.net_calorific_value_unit = r.net_calorific_value.unit; }
    if (r.oxidation_factor) cf.oxidation_factor = pctToFrac(r.oxidation_factor);
    if (r.conversion_factor) cf.conversion_factor = pctToFrac(r.conversion_factor);
    if (r.carbon_content) cf.carbon_content = r.carbon_content.value;
    if (r.biomass_content) cf.biomass_fraction = pctToFrac(r.biomass_content);
    n.calculation_factors = cf;
  }

  /* Process context outside the CBAM boundary has no B row; its quantity is its flow's. */
  const rowed = new Set(B.map(r => r.source_stream_id));
  const Fq = new Map((period.flows || []).map(r => [r.flow_id, r]));
  for (const n of m.nodes) {
    if (n.kind !== 'source_stream' || rowed.has(n.id) || n.cbam_relevant !== false) continue;
    const f = m.flows.find(x => x.from === n.id && Fq.get(x.id) && Fq.get(x.id).quantity && Fq.get(x.id).quantity.value != null);
    if (f) n.activity_data = Object.assign({}, n.activity_data || {}, { value: Fq.get(f.id).quantity.value, unit: Fq.get(f.id).quantity.unit || (n.activity_data || {}).unit });
  }

  const D = (period.D || {}).processes || [];
  const goodsOf = pid => m.nodes.filter(n => n.kind === 'good' && n.production_process === pid && n.is_cbam_good !== false);
  let elecTotal = 0, heatOut = 0, heatUnit = 'TJ';
  for (const r of D) {
    const goods = goodsOf(r.production_process_id);
    if (goods.length === 1 && r.total_production && r.total_production.value != null) {
      goods[0].quantity = { value: r.total_production.value, unit: r.total_production.unit || 't' };
      goods[0].template_ref = r.template_ref;
    }
    if (r.electricity && r.electricity.consumption && r.electricity.consumption.value != null) elecTotal += r.electricity.consumption.value;
    if (r.measurable_heat && r.measurable_heat.exported && r.measurable_heat.exported.value != null) {
      heatOut += r.measurable_heat.exported.value; heatUnit = r.measurable_heat.exported.unit || heatUnit;
    }
  }
  for (const n of m.nodes) {
    if (n.kind === 'electricity_import' && D.some(r => r.electricity)) {
      n.activity_data = Object.assign({}, n.activity_data || {}, { value: elecTotal, unit: 'MWh' });
    }
    if (n.kind === 'heat_export' && heatOut) {
      n.activity_data = Object.assign({}, n.activity_data || {}, { value: heatOut, unit: heatUnit });
    }
  }

  const F = new Map((period.flows || []).map(r => [r.flow_id, r]));
  for (const f of m.flows) {
    const r = F.get(f.id);
    f.carbon_t = r && r.carbon_t != null ? r.carbon_t : null;
    if (r && r.quantity) f.quantity = r.quantity;
  }
  /* A residue's quantity is what flows into it. */
  for (const n of m.nodes) {
    if (n.kind !== 'residue') continue;
    const q = m.flows.filter(f => f.to === n.id && f.quantity && f.quantity.value != null);
    if (q.length) n.quantity = { value: q.reduce((s, f) => s + f.quantity.value, 0), unit: q[0].quantity.unit };
  }

  const cal = new Map((period.calibration || []).map(r => [r.instrument_id, r]));
  for (const i of m.instruments) {
    const r = cal.get(i.id);
    i.last_calibration = r ? r.last_calibration : null;
  }

  /* Workbook rows that matched no plan element: kept, and raised by the audit. */
  m.template_unmatched = [];
  for (const r of B) if (!r.source_stream_id) m.template_unmatched.push({ sheet: 'B_EmInst', template_ref: r.template_ref, name: r.name || '', kind: 'source stream' });
  for (const r of period.Summary_Products || []) if (!r.good_id) m.template_unmatched.push({ sheet: 'Summary_Products', template_ref: r.template_ref, name: r.product_name || r.cn_code || '', kind: 'good' });
  for (const r of (period.E || {}).purchased_precursors || []) if (!r.node_id) m.template_unmatched.push({ sheet: 'E_PurchPrec', template_ref: r.template_ref, name: r.name || '', kind: 'purchased precursor' });
  return m;
}

/* A schema 0.1 file (structure and values in one object) opens as a plan plus a period.
   Mirrors examples/split_model.py for the fields the viewer reads. */
function splitLegacy(model) {
  const inst = model.installation || {};
  const plan = {
    document_type: 'plan', schema_version: '0.2',
    installation: Object.fromEntries(Object.entries(inst).filter(([k]) => !['reporting_period', 'monitoring_plan_version', 'monitoring_plan_date'].includes(k))),
    monitoring_plan: { version: inst.monitoring_plan_version || '—', date: inst.monitoring_plan_date || '—' },
    production_processes: model.production_processes || [],
    nodes: model.nodes.map(n => {
      const p = Object.fromEntries(Object.entries(n).filter(([k]) => !['activity_data', 'calculation_factors', 'quantity'].includes(k)));
      if (n.activity_data && (n.activity_data.unit || n.activity_data.source)) {
        p.activity_data = {};
        if (n.activity_data.unit) p.activity_data.unit = n.activity_data.unit;
        if (n.activity_data.source) p.activity_data.source = n.activity_data.source;
      }
      const cf = n.calculation_factors || {};
      if (cf.determination || 'biomass_fraction_method' in cf) {
        p.calculation_factors = {};
        if (cf.determination) p.calculation_factors.determination = cf.determination;
        if ('biomass_fraction_method' in cf) p.calculation_factors.biomass_fraction_method = cf.biomass_fraction_method;
      }
      return p;
    }),
    flows: model.flows.map(f => Object.fromEntries(Object.entries(f).filter(([k]) => !['carbon_t', 'quantity'].includes(k)))),
    instruments: (model.instruments || []).map(i => Object.fromEntries(Object.entries(i).filter(([k]) => k !== 'last_calibration')))
  };
  if (model.energy) plan.energy = model.energy;
  const fuel = t => ['fossil_fuel', 'biomass_fuel', 'mixed_fuel'].includes(t);
  const meas = (v, u) => v == null ? undefined : (u ? { value: v, unit: u } : { value: v });
  const pct = v => v == null ? undefined : { value: v * 100, unit: '%' };
  const streams = model.nodes.filter(n => n.kind === 'source_stream');
  const B = streams.map((n, i) => {
    const cf = n.calculation_factors || {}, ad = n.activity_data || {};
    const row = { source_stream_id: n.id, template_ref: `B_EmInst row ${i + 1}`,
      method: n.methodology === 'none' || !n.methodology ? null : n.methodology === 'mass_balance' ? 'Mass Balance' : fuel(n.stream_type) ? 'Combustion' : 'Process emissions',
      activity_data: { value: ad.value == null ? null : ad.value, ...(ad.unit ? { unit: ad.unit } : {}) } };
    const nc = meas(cf.net_calorific_value, cf.net_calorific_value_unit); if (nc) row.net_calorific_value = nc;
    const ef = meas(cf.emission_factor, cf.emission_factor_unit); if (ef) row.emission_factor = ef;
    const cc = meas(cf.carbon_content, 'tC/t'); if (cc) row.carbon_content = cc;
    const ox = pct(cf.oxidation_factor); if (ox) row.oxidation_factor = ox;
    const cv = pct(cf.conversion_factor); if (cv) row.conversion_factor = cv;
    const bi = pct(cf.biomass_fraction); if (bi) row.biomass_content = bi;
    return row;
  });
  const D = (model.production_processes || []).map((p, i) => {
    const g = model.nodes.find(n => n.kind === 'good' && n.production_process === p.id);
    const row = { production_process_id: p.id, template_ref: `D_Processes ${i + 1}` };
    if (g && g.quantity && g.quantity.value != null) row.total_production = { value: g.quantity.value, unit: g.quantity.unit || 't' };
    const members = new Set(model.nodes.filter(n => n.production_process === p.id).map(n => n.id));
    const elecIds = new Set(model.nodes.filter(n => n.kind === 'electricity_import').map(n => n.id));
    const mwh = model.flows.filter(f => elecIds.has(f.from) && members.has(f.to) && f.quantity && f.quantity.value != null).reduce((s, f) => s + f.quantity.value, 0);
    if (mwh) row.electricity = { consumption: { value: mwh, unit: 'MWh' } };
    return row;
  });
  const period = {
    document_type: 'period', schema_version: '0.2',
    installation_ref: { name: inst.name, ...(inst.unlocode ? { unlocode: inst.unlocode } : {}) },
    plan_ref: { version: inst.monitoring_plan_version || '—', date: inst.monitoring_plan_date || '—' },
    reporting_period: inst.reporting_period || { start: '—', end: '—' },
    B: { source_streams: B }, D: { processes: D },
    flows: model.flows.map(f => ({ flow_id: f.id, ...(f.quantity ? { quantity: f.quantity } : {}), carbon_t: f.carbon_t == null ? null : f.carbon_t })),
    calibration: (model.instruments || []).filter(i => 'last_calibration' in i).map(i => ({ instrument_id: i.id, last_calibration: i.last_calibration }))
  };
  if (model.findings_expected) period.findings_expected = model.findings_expected;
  return { plan, period };
}

<script>/* Audit engine. Each finding names the clause of Implementing Regulation (EU) 2025/2547
   it comes from, so the diagram can be argued with rather than merely looked at.

   Two tiers. STRUCTURAL checks read the monitoring plan alone: what is monitored, how
   emissions are attributed, whether every element sits inside a boundary. PERIOD checks
   need a reporting period's values: whether carbon closes, whether the period's rows are
   complete, whether instruments were calibrated in time, whether the period was reported
   under the loaded plan version. With no period loaded the period tier is skipped. */

const CARBON_TOLERANCE_PCT = 0.1;

const SEVERITY_RANK = { gap: 0, double_counting: 1, closure: 2, quality: 3 };

function auditInstallation(model) {
  const findings = [];
  const periodLoaded = !!model.period_loaded;
  const byId = new Map(model.nodes.map(n => [n.id, n]));
  const inbound = new Map();
  const outbound = new Map();

  for (const f of model.flows) {
    if (!inbound.has(f.to)) inbound.set(f.to, []);
    if (!outbound.has(f.from)) outbound.set(f.from, []);
    inbound.get(f.to).push(f);
    outbound.get(f.from).push(f);
  }

  const relevant = n => n.cbam_relevant !== false;
  const structural = f => findings.push(Object.assign({ tier: 'structural' }, f));
  const period = f => { if (periodLoaded) findings.push(Object.assign({ tier: 'period' }, f)); };

  for (const node of model.nodes) {
    if (!relevant(node)) continue;

    if (node.kind === 'source_stream' && node.methodology === 'none') {
      structural({
        severity: 'gap',
        code: 'UNMONITORED_SOURCE_STREAM',
        title: `${node.name} is inside the boundary but not monitored`,
        detail: node.note || 'No activity data is determined for this source stream, so its emissions cannot enter the calculation.',
        refs: node.regulation_refs || ['Annex II A.5(7)(b)'],
        nodes: [node.id]
      });
    }

    if (node.kind === 'residue' && node.methodology === 'none') {
      const carbonOut = sumCarbon(inbound.get(node.id));
      if (carbonOut.known > 0) {
        period({
          severity: 'gap',
          code: 'RESIDUE_NOT_CALCULATED',
          title: `${node.name} carries carbon out of the system with no separate calculation`,
          detail: `${fmt(carbonOut.known)} t C leaves as ${node.name.toLowerCase()}. Where dust leaves the kiln system its emissions must be calculated separately and added.`,
          refs: node.regulation_refs || ['Annex II B.9.2.3'],
          nodes: [node.id]
        });
      }
    }

    const split = node.attribution_split;
    if (split) {
      const total = Object.values(split).reduce((a, b) => a + b, 0);
      if (Math.abs(total - 1) > 1e-6) {
        structural({
          severity: 'double_counting',
          code: total > 1 ? 'ATTRIBUTION_OVER_ONE' : 'ATTRIBUTION_UNDER_ONE',
          title: `${node.name} is attributed ${total.toFixed(2)} across production processes`,
          detail: total > 1
            ? `Fractions sum to more than one, so these emissions are counted in more than one production process. The monitoring plan diagram must evidence that no double counting occurs.`
            : `Fractions sum to less than one, leaving part of these emissions attributed to no production process.`,
          refs: ['Annex II A.5(13)', 'Annex III'],
          nodes: [node.id]
        });
      }
    }

    const needsAttribution = ['source_stream', 'emission_source', 'process_unit', 'good', 'residue'];
    if (needsAttribution.includes(node.kind) && !node.production_process && !split) {
      structural({
        severity: 'gap',
        code: 'UNATTRIBUTED',
        title: `${node.name} belongs to no production process`,
        detail: 'Emissions can only be turned into specific embedded emissions once every stream and source is attributed to a production process.',
        refs: ['Annex II A.1(1)(e)', 'Annex III'],
        nodes: [node.id]
      });
    }

    const cf = node.calculation_factors || {};
    const biomassStream = ['biomass_fuel', 'mixed_fuel'].includes(node.stream_type);
    const biomassApplied = periodLoaded && cf.biomass_fraction > 0;
    /* A biomass or mixed fuel with no method is a fault of the plan; a fossil fuel filed with
       a biomass share is a fault of the filing. */
    if (node.kind === 'source_stream' && node.methodology !== 'none' && (biomassStream || biomassApplied) && !cf.biomass_fraction_method) {
      (biomassStream ? structural : period)({
        severity: 'gap',
        code: 'ZERO_RATING_UNSUBSTANTIATED',
        title: `${node.name} is zero-rated on an undemonstrated biomass fraction`,
        detail: `${biomassApplied ? `A biomass fraction of ${cf.biomass_fraction} is applied` : 'A biomass fraction is to be applied'} with no stated analysis method. The monitoring plan must record how the operator demonstrates that zero-rating applies.`,
        refs: ['Annex II A.5(15)'],
        nodes: [node.id]
      });
    }

    if (node.kind === 'source_stream' && node.methodology === 'standard') {
      const isFuel = ['fossil_fuel', 'biomass_fuel', 'mixed_fuel'].includes(node.stream_type);
      const hasRow = node.activity_data && node.activity_data.value != null;
      if (isFuel && periodLoaded && hasRow && (cf.emission_factor == null || cf.net_calorific_value == null)) {
        period({
          severity: 'quality',
          code: 'MISSING_CALCULATION_FACTOR',
          title: `${node.name} is missing a calculation factor`,
          detail: 'The standard method for a fuel needs both an emission factor and a net calorific value in the period\'s source-stream row.',
          refs: ['Annex II B.3.1'],
          nodes: [node.id]
        });
      }
      if (periodLoaded && node.activity_data && node.activity_data.value == null) {
        period({
          severity: 'gap',
          code: 'PERIOD_ROW_INCOMPLETE',
          title: `${node.name} has no activity data for the period`,
          detail: `The plan monitors this stream${node.activity_data.source ? ` (${node.activity_data.source})` : ''}, but its source-stream row${node.template_ref ? ` (${node.template_ref})` : ''} carries no activity data.`,
          refs: ['Annex II B.4', 'Annex IV 16(a)'],
          nodes: [node.id]
        });
      }
    }

    const touches = (inbound.get(node.id) || []).length + (outbound.get(node.id) || []).length;
    if (touches === 0) {
      structural({
        severity: 'gap',
        code: 'ORPHAN_NODE',
        title: `${node.name} is drawn but connected to nothing`,
        detail: 'A node with no flows cannot be shown to be inside or outside the system boundary.',
        refs: ['Annex II A.5(13)'],
        nodes: [node.id]
      });
    }
  }

  if (periodLoaded) {
    for (const node of model.nodes) {
      if (!['process_unit', 'emission_source'].includes(node.kind)) continue;
      const ins = inbound.get(node.id) || [];
      const outs = outbound.get(node.id) || [];
      if (!ins.length || !outs.length) continue;

      const cIn = sumCarbon(ins);
      const cOut = sumCarbon(outs);

      if (cIn.unknown || cOut.unknown) {
        period({
          severity: 'gap',
          code: 'BALANCE_INDETERMINATE',
          title: `Carbon across ${node.name} cannot be closed`,
          detail: `${cIn.unknown + cOut.unknown} connected flow(s) carry no determined carbon quantity, so the balance at this unit cannot be tested at all.`,
          refs: ['Annex II A.5(13)', 'Annex II A.2'],
          nodes: [node.id],
          flows: [...ins, ...outs].filter(f => f.carbon_t == null).map(f => f.id)
        });
        continue;
      }

      const gap = cIn.known - cOut.known;
      const tolerance = Math.max(1, cIn.known * CARBON_TOLERANCE_PCT / 100);
      if (Math.abs(gap) > tolerance) {
        period({
          severity: 'closure',
          code: 'CARBON_NOT_CLOSED',
          title: `Carbon does not close across ${node.name}`,
          detail: `${fmt(cIn.known)} t C in against ${fmt(cOut.known)} t C out. ${gap < 0 ? 'More carbon leaves than enters' : 'Carbon enters and is not accounted for on the way out'}, by ${fmt(Math.abs(gap))} t C (${(Math.abs(gap) / cIn.known * 100).toFixed(2)} %).`,
          refs: ['Annex II A.5(13)', 'Annex II B.1'],
          nodes: [node.id]
        });
      }
    }

    const end = model.installation?.reporting_period?.end;
    for (const inst of model.instruments || []) {
      if (!end || !inst.last_calibration) continue;
      const ageDays = (Date.parse(end) - Date.parse(inst.last_calibration)) / 86400000;
      if (inst.calibration_interval === 'Annual' && ageDays > 365) {
        period({
          severity: 'quality',
          code: 'CALIBRATION_OVERDUE',
          title: `${inst.id} ${inst.name} was last calibrated ${inst.last_calibration}`,
          detail: `That is ${Math.round(ageDays)} days before the end of the reporting period, against a stated annual interval.`,
          refs: ['Annex II A.5(22)(a)'],
          instruments: [inst.id]
        });
      }
    }

    /* The filing against itself: what a process's own source-stream rows add up to, what its
       production balance says, and what its products declare, each against the plan or the
       rest of the filing. */
    const D = (model.period && model.period.D && model.period.D.processes) || [];
    const emissionsOf = node => {
      const ad = node.activity_data && node.activity_data.value, cf = node.calculation_factors || {};
      if (ad == null || node.methodology === 'none' || !node.methodology) return null;
      const isFuel = ['fossil_fuel', 'biomass_fuel', 'mixed_fuel'].includes(node.stream_type);
      if (node.methodology === 'mass_balance') return cf.carbon_content == null ? null : ad * cf.carbon_content * 44 / 12;
      if (isFuel) return cf.emission_factor == null || cf.net_calorific_value == null ? null
        : ad * cf.net_calorific_value / 1000 * cf.emission_factor * (cf.oxidation_factor == null ? 1 : cf.oxidation_factor) * (1 - (cf.biomass_fraction || 0));
      return cf.emission_factor == null ? null : ad * cf.emission_factor * (cf.conversion_factor == null ? 1 : cf.conversion_factor);
    };
    for (const d of D) {
      const pid = d.production_process_id;
      const ppName = ((model.production_processes || []).find(p => p.id === pid) || { name: pid }).name;
      const filed = d.directly_attributable_emissions && d.directly_attributable_emissions.value;
      if (filed != null) {
        let sum = 0, known = 0;
        for (const node of model.nodes) {
          if (node.kind !== 'source_stream' || !relevant(node)) continue;
          const frac = node.production_process === pid ? 1 : (node.attribution_split || {})[pid];
          if (!frac) continue;
          const e = emissionsOf(node);
          if (e != null) { sum += e * frac; known++; }
        }
        for (const node of model.nodes) {
          if (node.kind !== 'residue' || node.production_process !== pid || node.methodology === 'none') continue;
          const c = sumCarbon(inbound.get(node.id));
          if (!c.unknown) sum += c.known * 44 / 12;
        }
        if (known && Math.abs(sum - filed) > Math.max(10, 0.01 * Math.max(sum, filed))) {
          period({
            severity: 'closure',
            code: 'DIRECT_EMISSIONS_MISMATCH',
            title: `Directly attributable emissions filed for ${ppName} do not match its source-stream rows`,
            detail: `${d.template_ref ? d.template_ref + ' ' : ''}(g) files ${fmt(filed)} tCO2e; the source-stream rows attributed to this process add up to ${fmt(sum)} tCO2e${sum > filed ? ', more' : ', less'} by ${fmt(Math.abs(sum - filed))} (${(Math.abs(sum - filed) / Math.max(sum, filed) * 100).toFixed(1)} %).`,
            refs: ['Annex III A.1', 'Annex IV 16(a)'],
            nodes: model.nodes.filter(n => n.kind === 'emission_source' && n.production_process === pid).map(n => n.id)
          });
        }
      }
      const total = d.total_production && d.total_production.value;
      if (total != null) {
        const market = (d.produced_for_market || {}).value || 0;
        const consumed = (d.consumed_in_processes || []).reduce((s, c) => s + ((c.amount || {}).value || 0), 0);
        const nonCbam = (d.consumed_for_non_cbam_goods || {}).value || 0;
        const uses = market + consumed + nonCbam;
        if (Math.abs(uses - total) > Math.max(1, 0.001 * total)) {
          period({
            severity: 'closure',
            code: 'PRODUCTION_BALANCE_OPEN',
            title: `Production of ${ppName} does not balance its uses`,
            detail: `${fmt(total)} t produced against ${fmt(market)} t for the market, ${fmt(consumed)} t consumed in other processes and ${fmt(nonCbam)} t for non-CBAM goods: ${fmt(uses)} t, ${uses > total ? 'more' : 'less'} by ${fmt(Math.abs(uses - total))} t.`,
            refs: ['Annex III A.1', 'Annex IV 13'],
            nodes: model.nodes.filter(n => n.kind === 'good' && n.production_process === pid).map(n => n.id)
          });
        }
      }
    }
    for (const r of (model.period && model.period.Summary_Products) || []) {
      const good = r.good_id && model.nodes.find(n => n.id === r.good_id);
      if (!good || !good.composition) continue;
      const q = r.qualifying_parameters || {};
      const pairs = [['clinker_factor', 'clinker_content']];
      for (const [filedKey, planKey] of pairs) {
        if (q[filedKey] == null || good.composition[planKey] == null) continue;
        const a = Number(q[filedKey]), b = Number(good.composition[planKey]);
        if (Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) > 0.005) {
          period({
            severity: 'quality',
            code: 'QUALIFYING_PARAMETER_MISMATCH',
            title: `${good.name} is filed with ${filedKey.replace(/_/g, ' ')} ${a}, the plan declares ${b}`,
            detail: `${r.template_ref || 'Summary_Products'} carries ${filedKey.replace(/_/g, ' ')} ${a}; the monitoring plan declares ${planKey.replace(/_/g, ' ')} ${b} for this good (A.5(3)). The declared composition sets the benchmark and the default-value comparison for the good.`,
            refs: ['Annex II A.5(3)', 'Annex IV 15(b)'],
            nodes: [good.id]
          });
        }
      }
    }

    for (const u of model.template_unmatched || []) {
      period({
        severity: 'gap',
        code: 'TEMPLATE_ROW_UNMATCHED',
        title: `${u.name || 'An unnamed row'} is reported in the workbook but named nowhere in the monitoring plan`,
        detail: `${u.sheet}${u.template_ref ? ` (${u.template_ref})` : ''} carries a ${u.kind} the loaded plan does not list. Either the plan is incomplete, or the report names the element differently from the plan; both must be resolved before the report can be verified against the plan.`,
        refs: u.kind === 'good' ? ['Annex II A.5(3)', 'Annex IV 15'] : u.kind === 'purchased precursor' ? ['Annex II A.5(14)', 'Annex IV 20'] : ['Annex II A.5(9)', 'Annex IV 16(a)'],
        nodes: []
      });
    }

    const ref = (model.period && model.period.plan_ref) || {};
    const mp = model.installation || {};
    if (ref.version && mp.monitoring_plan_version && ref.version !== mp.monitoring_plan_version) {
      period({
        severity: 'quality',
        code: 'PLAN_REF_MISMATCH',
        title: `The period was reported under monitoring plan version ${ref.version}, the loaded plan is version ${mp.monitoring_plan_version}`,
        detail: `The reporting period ${model.installation.reporting_period?.start || ''} to ${model.installation.reporting_period?.end || ''} names plan version ${ref.version}${ref.date ? ` of ${ref.date}` : ''}. The plan on the sheet is version ${mp.monitoring_plan_version}${mp.monitoring_plan_date ? ` of ${mp.monitoring_plan_date}` : ''}. Either the wrong plan is loaded or the data was monitored under a superseded methodology.`,
        refs: ['Annex II A.5(1)', 'Art. 9'],
        nodes: []
      });
    }
  }

  findings.sort((a, b) => SEVERITY_RANK[a.severity] - SEVERITY_RANK[b.severity]);
  return { findings, balances: computeBalances(model, inbound, outbound), period_loaded: periodLoaded };
}

function computeBalances(model, inbound, outbound) {
  const out = new Map();
  for (const node of model.nodes) {
    if (!['process_unit', 'emission_source'].includes(node.kind)) continue;
    if (!model.period_loaded) { out.set(node.id, { in: 0, out: 0, gap: 0, status: 'no_period' }); continue; }
    const ins = sumCarbon(inbound.get(node.id));
    const outs = sumCarbon(outbound.get(node.id));
    let status = 'closed';
    if (ins.unknown || outs.unknown) status = 'indeterminate';
    else if (Math.abs(ins.known - outs.known) > Math.max(1, ins.known * CARBON_TOLERANCE_PCT / 100)) status = 'open';
    out.set(node.id, { in: ins.known, out: outs.known, gap: ins.known - outs.known, status });
  }
  return out;
}

function sumCarbon(flows) {
  let known = 0, unknown = 0;
  for (const f of flows || []) {
    if (f.carbon_t == null) unknown++;
    else known += f.carbon_t;
  }
  return { known, unknown };
}

function fmt(n) {
  return Math.round(n).toLocaleString('en-GB').replace(/,/g, ' ');
}

<script>/* Drawing vocabulary: equipment silhouettes and ribbon geometry.
   Silhouettes follow the cement-plant shapes a plant engineer recognises
   (ISO 10628 draws equipment as unfilled outlines, not icons). */

/* Severity is ranked by WORD, never by marker shape: shape is not an ordered visual
   variable, and ISO 7010 / ANSI Z535 both rank by signal word for the same reason.
   Marker shape carries finding TYPE instead. */
var RANK = {
  gap:             { word: 'BLOCKING',    tier: 1 },
  double_counting: { word: 'BLOCKING',    tier: 1 },
  closure:         { word: 'MATERIAL',    tier: 2 },
  quality:         { word: 'OBSERVATION', tier: 3 }
};

/* Derived from the ISA-5.1 letter tables (W weight, F flow, J power, A analysis;
   Q totalise, I indicate). Derived, not read off an as-built drawing. */
function isaCode(inst) {
  const t = `${inst.type || ''} ${inst.name || ''}`.toLowerCase();
  if (/weigh|belt|scale|feeder|bridge/.test(t)) return 'WQI';
  if (/gas|turbine|flow/.test(t)) return 'FQI';
  if (/electric|revenue|power/.test(t)) return 'JQI';
  if (/xrf|calorimeter|laborator|analys/.test(t)) return 'AI';
  if (/temperature|thermo|^tt-/.test(t) || /^TT-/.test(inst.id || '')) return 'TI';
  return 'QI';
}

/* Layer vocabulary shared with sheet 02: material, fuel, gas, energy. */
function layerOfFlow(f) {
  if (f.kind === 'fuel') return 'fuel';
  if (['flue_gas', 'co2', 'dust', 'waste_gas'].includes(f.kind)) return 'gas';
  if (['electricity', 'heat'].includes(f.kind)) return 'energy';
  return 'material';
}

function pathRect(x, y, w, h) {
  return `M${x},${y} H${x + w} V${y + h} H${x} Z`;
}

const SYMBOLS = {
  /* The cement signature: a preheater tower of stacked cyclones standing over an
     inclined rotary tube with tyres and a girth gear. Drawn tall because it is tall. */
  kiln(w, h) {
    const p = [];
    const tw = 0.34 * w;                       // preheater tower width
    const riser = tw * 0.58;
    p.push(`<path class="s-detail" d="M${riser},${0.92 * h} V${0.02 * h}"/>`);
    for (let i = 0; i < 4; i++) {              // four cyclone stages, inverted cones
      const yt = 0.02 * h + i * 0.135 * h, hh = 0.125 * h;
      p.push(`<path class="s-body" d="M${0.01 * w},${yt} H${tw} V${yt + hh * 0.44} L${riser + tw * 0.13},${yt + hh} H${riser - tw * 0.09} L${0.01 * w},${yt + hh * 0.44} Z"/>`);
    }
    const x0 = tw * 0.30, x1 = 0.99 * w;
    const tTop = 0.60 * h, tBot = 0.80 * h, drop = 0.14 * h;
    p.push(`<path class="s-body" d="M${x0},${tTop} L${x1},${tTop + drop} L${x1},${tBot + drop} L${x0},${tBot} Z"/>`);
    for (const f of [0.30, 0.72]) {            // tyres
      const cx = x0 + (x1 - x0) * f;
      const yt = tTop + drop * f - 3, yb = tBot + drop * f + 3;
      p.push(`<path class="s-detail" d="M${cx - 2.5},${yt} L${cx - 2.5},${yb} M${cx + 2.5},${yt} L${cx + 2.5},${yb}"/>`);
    }
    const gx = x0 + (x1 - x0) * 0.50;          // girth gear
    p.push(`<path class="s-hatch-fill" d="M${gx - 4},${tTop + drop * 0.50 - 4} H${gx + 4} V${tBot + drop * 0.50 + 4} H${gx - 4} Z"/>`);
    p.push(`<path class="s-detail" d="M${tw * 0.70},${0.80 * h} L${x0 + 2},${tTop + 5}"/>`);
    return p.join('');
  },

  /* Squat mill body with a classifier cone on top. */
  mill(w, h) {
    const p = [];
    p.push(`<path class="s-body" d="M${0.10 * w},${0.46 * h} H${0.90 * w} V${0.84 * h} H${0.10 * w} Z"/>`);
    p.push(`<path class="s-body" d="M${0.36 * w},${0.46 * h} L${0.42 * w},${0.16 * h} H${0.58 * w} L${0.64 * w},${0.46 * h} Z"/>`);
    p.push(`<path class="s-detail" d="M${0.46 * w},${0.16 * h} V${0.06 * h} H${0.54 * w} V${0.16 * h}"/>`);
    for (const f of [0.30, 0.50, 0.70]) {
      p.push(`<path class="s-detail" d="M${f * w},${0.52 * h} V${0.78 * h}"/>`);
    }
    return p.join('');
  },

  /* Grate cooler: hood over a box with a grate line. */
  cooler(w, h) {
    const p = [];
    p.push(`<path class="s-body" d="M${0.20 * w},${0.40 * h} L${0.14 * w},${0.20 * h} H${0.62 * w} L${0.56 * w},${0.40 * h} Z"/>`);
    p.push(`<path class="s-body" d="M${0.10 * w},${0.40 * h} H${0.90 * w} V${0.82 * h} H${0.10 * w} Z"/>`);
    p.push(`<path class="s-detail" d="M${0.14 * w},${0.70 * h} L${0.86 * w},${0.62 * h}"/>`);
    for (let i = 0; i < 6; i++) {
      const x = (0.18 + i * 0.12) * w;
      p.push(`<path class="s-detail" d="M${x},${0.70 * h - i * 0.013 * h} V${0.80 * h}"/>`);
    }
    return p.join('');
  },

  /* Bag filter: clean-gas hood, bag house, dust hopper. */
  filter(w, h) {
    const p = [];
    p.push(`<path class="s-detail" d="M${0.46 * w},${0.24 * h} V${0.08 * h} H${0.54 * w} V${0.24 * h}"/>`);
    p.push(`<path class="s-body" d="M${0.20 * w},${0.24 * h} H${0.80 * w} V${0.64 * h} H${0.20 * w} Z"/>`);
    for (const f of [0.32, 0.44, 0.56, 0.68]) {
      p.push(`<path class="s-detail" d="M${f * w},${0.28 * h} V${0.60 * h}"/>`);
    }
    p.push(`<path class="s-body" d="M${0.20 * w},${0.64 * h} H${0.80 * w} L${0.56 * w},${0.88 * h} H${0.44 * w} Z"/>`);
    return p.join('');
  },

  /* Tapering stack on a plinth. */
  stack(w, h) {
    const p = [];
    p.push(`<path class="s-body" d="M${0.34 * w},${0.90 * h} L${0.42 * w},${0.06 * h} H${0.58 * w} L${0.66 * w},${0.90 * h} Z"/>`);
    p.push(`<path class="s-hatch-fill" d="M${0.26 * w},${0.90 * h} H${0.74 * w} V${0.98 * h} H${0.26 * w} Z"/>`);
    for (const f of [0.30, 0.52, 0.74]) {
      const t = f, xl = 0.34 * w + (0.42 - 0.34) * w * (1 - t), xr = 0.66 * w - (0.66 - 0.58) * w * (1 - t);
      p.push(`<path class="s-detail" d="M${xl},${(1 - t) * 0.84 * h + 0.06 * h} H${xr}"/>`);
    }
    return p.join('');
  },

  /* Hot gas generator: a fired vessel with a burner lance and flame. */
  burner(w, h) {
    const p = [];
    p.push(`<path class="s-body" d="M${0.28 * w},${0.38 * h} H${0.82 * w} Q${0.92 * w},${0.38 * h} ${0.92 * w},${0.58 * h} Q${0.92 * w},${0.78 * h} ${0.82 * w},${0.78 * h} H${0.28 * w} Z"/>`);
    p.push(`<path class="s-detail" d="M${0.34 * w},${0.58 * h} Q${0.46 * w},${0.44 * h} ${0.62 * w},${0.58 * h} Q${0.46 * w},${0.72 * h} ${0.34 * w},${0.58 * h} Z"/>`);
    p.push(`<path class="s-detail" d="M${0.06 * w},${0.58 * h} H${0.28 * w}"/>`);
    p.push(`<path class="s-detail" d="M${0.62 * w},${0.38 * h} V${0.22 * h} H${0.74 * w} V${0.38 * h}"/>`);
    return p.join('');
  },

  vessel(w, h) {
    return `<path class="s-body" d="M${0.20 * w},${0.28 * h} H${0.80 * w} Q${0.88 * w},${0.28 * h} ${0.88 * w},${0.40 * h} V${0.72 * h} Q${0.88 * w},${0.84 * h} ${0.80 * w},${0.84 * h} H${0.20 * w} Q${0.12 * w},${0.84 * h} ${0.12 * w},${0.72 * h} V${0.40 * h} Q${0.12 * w},${0.28 * h} ${0.20 * w},${0.28 * h} Z"/>`;
  },

  silo(w, h) {
    return `<path class="s-body" d="M${0.28 * w},${0.14 * h} H${0.72 * w} V${0.62 * h} L${0.54 * w},${0.88 * h} H${0.46 * w} L${0.28 * w},${0.62 * h} Z"/>`;
  }
};

/* Battery-limit terminator: ISO/Turton convention for a line crossing the sheet edge. */
function terminatorMark(cx, cy, r) {
  return `<circle class="t-ring" cx="${cx}" cy="${cy}" r="${r}"/>` +
         `<path class="t-half" d="M${cx},${cy - r} A${r},${r} 0 0 0 ${cx},${cy + r} Z"/>`;
}

/* Cubic bezier sampled into a closed ribbon polygon, so every flow has a
   contour rather than being a fat stroke. Colour never replaces line. */
function ribbonPath(p0, p1, p2, p3, halfW, steps = 26) {
  const at = t => {
    const u = 1 - t;
    return {
      x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
      y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y
    };
  };
  const dt = t => {
    const u = 1 - t;
    return {
      x: 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
      y: 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y)
    };
  };
  const up = [], down = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, c = at(t), d = dt(t);
    const n = Math.hypot(d.x, d.y) || 1;
    const nx = -d.y / n * halfW, ny = d.x / n * halfW;
    up.push(`${(c.x + nx).toFixed(2)},${(c.y + ny).toFixed(2)}`);
    down.push(`${(c.x - nx).toFixed(2)},${(c.y - ny).toFixed(2)}`);
  }
  return `M${up.join(' L')} L${down.reverse().join(' L')} Z`;
}

function centreline(p0, p1, p2, p3) {
  return `M${p0.x},${p0.y} C${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`;
}
