<script>/* Sheet layout and rendering.
   Two rules from ISO 10628 govern the geometry: main flow runs left to right (5.3.3),
   and vertical placement follows real plant elevation (5.2) — a preheater is drawn
   high because it stands high. Line weights follow the 5.3.1 three-tier hierarchy. */

const COL_W = 208;
const ROW_GAP = 20;
const BAND_GAP = 74;
const PAD = 22;
const FRAME_PAD = 16;
const BASIS_H = 96;
const TITLE_H = 0;

const FOOT = {
  process_unit:    { w: 150, h: 124 },
  emission_source: { w: 150, h: 124 },
  emission_point:  { w: 88,  h: 124 },
  good:            { w: 168, h: 36 },
  residue:         { w: 168, h: 36 },
  _terminal:       { w: 178, h: 30 }
};
const foot = kind => FOOT[kind] || FOOT._terminal;

const KIND_LABEL = {
  source_stream: 'Source stream', process_unit: 'Process unit',
  emission_source: 'Emission source', emission_point: 'Emission point',
  good: 'Good', residue: 'Residue', precursor_import: 'Precursor',
  heat_import: 'Heat in', heat_export: 'Heat out',
  electricity_import: 'Electricity in', electricity_export: 'Electricity out',
  co2_transfer: 'CO2 transfer', waste_gas_transfer: 'Waste gas'
};

/* RANK and isaCode live in sheet.js: vocabulary shared by every sheet. */

function layout(model) {
  const byId = new Map(model.nodes.map(n => [n.id, n]));
  const preds = new Map(model.nodes.map(n => [n.id, []]));
  for (const f of model.flows) {
    if (byId.has(f.from) && byId.has(f.to)) preds.get(f.to).push(f.from);
  }

  const rank = new Map(), busy = new Set();
  const rankOf = id => {
    if (rank.has(id)) return rank.get(id);
    if (busy.has(id)) return 0;
    busy.add(id);
    const p = preds.get(id) || [];
    const r = p.length ? Math.max(...p.map(rankOf)) + 1 : 0;
    busy.delete(id);
    rank.set(id, r);
    return r;
  };
  model.nodes.forEach(n => rankOf(n.id));

  const SHARED = '__shared__';
  const ppIds = (model.production_processes || []).map(p => p.id);
  const groups = [...ppIds, SHARED];
  const groupOf = n => (n.production_process && ppIds.includes(n.production_process)) ? n.production_process : SHARED;
  const declared = new Map(model.nodes.map((n, i) => [n.id, i]));

  const cell = new Map();
  for (const n of model.nodes) {
    const k = `${rank.get(n.id)}|${groupOf(n)}`;
    if (!cell.has(k)) cell.set(k, []);
    cell.get(k).push(n);
  }
  /* Within a column, higher elevation draws higher (ISO 10628 5.2). */
  for (const list of cell.values()) {
    list.sort((a, b) => (b.elevation ?? 0) - (a.elevation ?? 0) || declared.get(a.id) - declared.get(b.id));
  }

  const maxRank = Math.max(...rank.values());
  const stackH = list => list.reduce((s, n) => s + foot(n.kind).h, 0) + (list.length - 1) * ROW_GAP;

  const bandH = new Map();
  for (const g of groups) {
    let m = 0;
    for (let r = 0; r <= maxRank; r++) {
      const l = cell.get(`${r}|${g}`);
      if (l) m = Math.max(m, stackH(l));
    }
    bandH.set(g, m);
  }

  const bandTop = new Map();
  let y = PAD + BASIS_H;
  for (const g of groups) {
    if (!bandH.get(g)) continue;
    bandTop.set(g, y);
    y += bandH.get(g) + BAND_GAP;
  }
  const contentBottom = y - BAND_GAP;

  const pos = new Map();
  for (const [k, list] of cell) {
    const r = Number(k.split('|')[0]), g = k.split('|')[1];
    let cy = bandTop.get(g) + (bandH.get(g) - stackH(list)) / 2;
    for (const n of list) {
      const f = foot(n.kind);
      pos.set(n.id, { x: PAD + r * COL_W, y: cy, w: f.w, h: f.h, rank: r, band: g });
      cy += f.h + ROW_GAP;
    }
  }

  return { pos, bandTop, bandH, width: PAD * 2 + maxRank * COL_W + FOOT._terminal.w, height: contentBottom + PAD + TITLE_H };
}

function boundaryBoxes(model, lay) {
  const out = [];
  for (const pp of model.production_processes || []) {
    const mem = model.nodes.filter(n => n.production_process === pp.id && lay.pos.has(n.id));
    if (!mem.length) continue;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const n of mem) {
      const p = lay.pos.get(n.id);
      x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
      x2 = Math.max(x2, p.x + p.w); y2 = Math.max(y2, p.y + p.h);
    }
    out.push({ pp, x: x1 - 18, y: y1 - 30, w: x2 - x1 + 36, h: y2 - y1 + 48 });
  }
  return out;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function wrap(text, max, maxLines = 2) {
  const words = String(text).split(/\s+/), lines = [];
  let line = '';
  for (const w of words) {
    if (!line) line = w;
    else if ((line + ' ' + w).length <= max) line += ' ' + w;
    else { lines.push(line); line = w; if (lines.length === maxLines) break; }
  }
  if (line && lines.length < maxLines) lines.push(line);
  if (lines.join(' ').split(/\s+/).length < words.length) {
    lines[lines.length - 1] = lines[lines.length - 1] + '…';
  }
  return lines;
}

function bezierAt(g, t) {
  const u = 1 - t;
  return {
    x: u*u*u*g.p0.x + 3*u*u*t*g.p1.x + 3*u*t*t*g.p2.x + t*t*t*g.p3.x,
    y: u*u*u*g.p0.y + 3*u*u*t*g.p1.y + 3*u*t*t*g.p2.y + t*t*t*g.p3.y
  };
}

function render(model, audit, lay) {
  const instById = new Map((model.instruments || []).map(i => [i.id, i]));
  const maxC = Math.max(...model.flows.map(f => f.carbon_t || 0), 1);
  /* With no period loaded nothing is determined yet: every ribbon takes one nominal width. */
  const halfW = c => !model.period_loaded ? 3.0 : (c == null ? 2.4 : 0.9 + 7.2 * Math.sqrt(Math.max(c, 0) / maxC));

  const findingOf = new Map();
  audit.findings.forEach((f, i) => {
    for (const id of f.nodes || []) {
      if (!findingOf.has(id)) findingOf.set(id, []);
      findingOf.get(id).push({ ...f, idx: i });
    }
  });

  const W = lay.width + FRAME_PAD * 2, H = lay.height + FRAME_PAD * 2;
  const o = [];
  o.push(`<svg id="canvas" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`);
  o.push(`<defs>
    <pattern id="hatch-gap" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hx-gap" x1="0" y1="0" x2="0" y2="6"/></pattern>
    <pattern id="hatch-cut" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hx-cut" x1="0" y1="0" x2="0" y2="5"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ar" d="M0,1 L9,5 L0,9 Z"/></marker>
  </defs>`);

  o.push(`<g transform="translate(${FRAME_PAD},${FRAME_PAD})">`);
  o.push(`<rect class="frame" x="0.5" y="0.5" width="${lay.width - 1}" height="${lay.height - 1}"/>`);

  /* System boundaries: long-dash-dot chain line, the drafting convention for a boundary. */
  o.push(`<g class="layer" data-layer="boundary">`);
  for (const b of boundaryBoxes(model, lay)) {
    o.push(`<g class="boundary" data-pp="${esc(b.pp.id)}">
      <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
      <text x="${b.x + 10}" y="${b.y + 15}">${esc(b.pp.name)} — CBAM system boundary</text>
      <text class="b-ref" x="${b.x + b.w - 10}" y="${b.y + 15}">${esc(b.pp.system_boundary_reference || '')}</text>
    </g>`);
  }
  o.push(`</g>`);

  /* Ports: spread connections across the inner height so converging flows stay distinct. */
  const inb = new Map(), outb = new Map();
  for (const f of model.flows) {
    if (!lay.pos.has(f.from) || !lay.pos.has(f.to)) continue;
    if (!inb.has(f.to)) inb.set(f.to, []);
    if (!outb.has(f.from)) outb.set(f.from, []);
    inb.get(f.to).push(f);
    outb.get(f.from).push(f);
  }
  for (const l of inb.values()) l.sort((a, b) => lay.pos.get(a.from).y - lay.pos.get(b.from).y);
  for (const l of outb.values()) l.sort((a, b) => lay.pos.get(a.to).y - lay.pos.get(b.to).y);
  const port = (list, id, p) => {
    const i = list.findIndex(f => f.id === id);
    const inner = p.h * 0.62, top = p.y + (p.h - inner) / 2;
    return top + inner * (i + 1) / (list.length + 1);
  };

  const flowGeom = new Map();
  for (const f of model.flows) {
    const a = lay.pos.get(f.from), z = lay.pos.get(f.to);
    if (!a || !z) continue;
    const p0 = { x: a.x + a.w, y: port(outb.get(f.from), f.id, a) };
    const p3 = { x: z.x, y: port(inb.get(f.to), f.id, z) };
    const dx = Math.max(46, (p3.x - p0.x) * 0.45);
    flowGeom.set(f.id, { p0, p1: { x: p0.x + dx, y: p0.y }, p2: { x: p3.x - dx, y: p3.y }, p3 });
  }

  /* One group per layer, so the layer toggles are plain visibility on both sheets. */
  const byLayer = { material: [], fuel: [], gas: [], energy: [] };
  for (const f of model.flows) {
    const g = flowGeom.get(f.id);
    if (!g) continue;
    const gap = flowGap(model, f);
    const cls = ['ribbon', `rb-${f.kind}`, gap ? 'rb-gap' : ''].filter(Boolean).join(' ');
    const title = gap ? `Stream ${f.stream_no}: carbon not determined`
                      : !model.period_loaded ? `Stream ${f.stream_no} — ${f.label || f.kind}`
                      : `Stream ${f.stream_no} — ${f.label || f.kind}: ${fmt(f.carbon_t)} t C`;
    const L = layerOfFlow(f);
    byLayer[L].push(`<path class="${cls}" data-flow="${f.id}" d="${ribbonPath(g.p0, g.p1, g.p2, g.p3, halfW(f.carbon_t))}"><title>${esc(title)}</title></path>`);
    byLayer[L].push(`<path class="cline ${gap ? 'cl-gap' : ''}" data-flow="${f.id}" d="${centreline(g.p0, g.p1, g.p2, g.p3)}" marker-end="url(#ar)"/>`);
  }
  for (const L of ['material', 'fuel', 'gas', 'energy']) o.push(`<g class="flows layer" data-layer="${L}">${byLayer[L].join('')}</g>`);

  for (const n of model.nodes) {
    const p = lay.pos.get(n.id);
    if (!p) continue;
    const issues = findingOf.get(n.id) || [];
    const cls = ['node', `nd-${n.kind}`, n.cbam_relevant === false ? 'nd-context' : '',
                 issues.length ? `flagged tier-${RANK[issues[0].severity].tier}` : ''].filter(Boolean).join(' ');
    o.push(`<g class="${cls}" data-node="${n.id}" tabindex="0">`);

    if (['process_unit', 'emission_source', 'emission_point'].includes(n.kind)) {
      const sym = SYMBOLS[n.symbol] || SYMBOLS.vessel;
      o.push(`<g class="sym" transform="translate(${p.x},${p.y})">${sym(p.w, p.h - 46)}</g>`);
      o.push(`<rect class="hit" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>`);
      /* Tag beside the symbol, never inside it (ISO 10628 5.4.3(a)). */
      if (n.equipment_tag) o.push(`<text class="tag halo" x="${p.x + p.w / 2}" y="${p.y + p.h - 32}">${esc(n.equipment_tag)}</text>`);
      wrap(n.name, 24, 2).forEach((l, i) =>
        o.push(`<text class="nm halo" x="${p.x + p.w / 2}" y="${p.y + p.h - 17 + i * 11}">${esc(l)}</text>`));
      /* Detail callout: the ISO 128 bubble, letter over sheet number, on a straight leader.
         Drafted annotation first, control second: only the cursor says it is clickable. */
      if (n.detail && n.detail.template === 'kiln_system') {
        const cx = p.x + p.w + 30, cy = p.y + 14;
        o.push(`<g class="callout" data-sheet="02" tabindex="0"><path class="ldr-halo" d="M${p.x + p.w - 8},${p.y + 30} L${cx - 11},${cy + 5}"/>` +
               `<path class="ldr" d="M${p.x + p.w - 8},${p.y + 30} L${cx - 11},${cy + 5}"/>` +
               `<circle cx="${cx}" cy="${cy}" r="12"/><line x1="${cx - 12}" y1="${cy}" x2="${cx + 12}" y2="${cy}"/>` +
               `<text x="${cx}" y="${cy - 2}">A</text><text class="cs" x="${cx}" y="${cy + 9}">02</text>` +
               `<text class="ctext" x="${cx + 16}" y="${cy + 4}">SEE SHEET 02</text><title>Kiln system detail, sheet 02</title></g>`);
      }
    } else if (n.kind === 'good' || n.kind === 'residue') {
      const cy = p.y + p.h / 2;
      o.push(n.kind === 'good'
        ? `<path class="g-flag" d="M${p.x},${cy - 12} H${p.x + 152} L${p.x + 164},${cy} L${p.x + 152},${cy + 12} H${p.x} Z"/>`
        : `<path class="r-pile" d="M${p.x + 4},${cy + 11} L${p.x + 24},${cy - 11} H${p.x + 150} L${p.x + 160},${cy + 11} Z"/>`);
      o.push(`<rect class="hit" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>`);
      o.push(`<text class="nm-in halo" x="${p.x + 30}" y="${cy + 4}">${esc(wrap(n.name, 28, 1)[0])}</text>`);
      if (n.cn_code) o.push(`<text class="cn" x="${p.x + 30}" y="${cy + 20}">CN ${esc(n.cn_code)}</text>`);
    } else {
      const cx = p.x + p.w - 8, cy = p.y + p.h / 2;
      o.push(terminatorMark(cx, cy, 7));
      o.push(`<rect class="hit" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>`);
      const lines = wrap(n.name, 30, 2);
      lines.forEach((l, i) =>
        o.push(`<text class="nm-r halo" x="${cx - 13}" y="${cy + 4 - (lines.length - 1) * 5.5 + i * 11}">${esc(l)}</text>`));
    }
    o.push(`</g>`);
  }

  /* Stream number flags and instrument bubbles, drawn over the ribbons. */
  o.push(`<g class="marks layer" data-layer="instruments">`);
  const ndMarks = [];
  for (const f of model.flows) {
    const g = flowGeom.get(f.id);
    if (!g) continue;
    const s = bezierAt(g, 0.30);
    o.push(`<g class="flag" data-flow="${f.id}"><path d="M${s.x},${s.y - 8} L${s.x + 13},${s.y} L${s.x},${s.y + 8} L${s.x - 13},${s.y} Z"/>` +
           `<text x="${s.x}" y="${s.y + 3.2}">${f.stream_no ?? ''}</text></g>`);

    const ids = f.instrument_ids || [];
    if (ids.length) {
      const b = bezierAt(g, 0.64), i0 = instById.get(ids[0]);
      if (i0) o.push(`<g class="bub" data-flow="${f.id}" data-inst="${esc(i0.id)}"><circle cx="${b.x}" cy="${b.y}" r="10"/>` +
        `<text x="${b.x}" y="${b.y - 0.5}">${isaCode(i0)}</text>` +
        `<text class="bt" x="${b.x}" y="${b.y + 7}">${esc(i0.id)}</text>` +
        `<title>${esc(i0.name + ' — ' + (i0.location || ''))}</title></g>`);
    } else if (flowGap(model, f)) {
      /* Mark absence positively: a reader will not notice a missing bubble. */
      const b = bezierAt(g, 0.64);
      ndMarks.push(`<g class="nd" data-flow="${f.id}"><rect x="${b.x - 13}" y="${b.y - 8}" width="26" height="16" rx="2"/>` +
             `<text x="${b.x}" y="${b.y + 4}">ND</text><title>Quantity never determined</title></g>`);
    }
  }
  o.push(`</g>`);

  /* The closure error drawn as its own branch. Sankey geometry otherwise asserts a
     balance that closes whether or not the data closes. */
  o.push(`<g class="unacc layer" data-layer="notes">${ndMarks.join('')}`);
  for (const [id, bal] of audit.balances) {
    if (bal.status !== 'open' || !lay.pos.has(id)) continue;
    const p = lay.pos.get(id);
    /* Drop into the band gap so the tag never lands on a neighbour's label. */
    const x0 = p.x + p.w * 0.60, y0 = p.y + p.h - 30;
    const x1 = x0 + 26, y1 = (lay.bandTop.get(p.band) ?? p.y) + (lay.bandH.get(p.band) ?? p.h) + 18;
    const hw = Math.max(halfW(Math.abs(bal.gap)), 2.4);
    o.push(`<path class="ua-rb" d="${ribbonPath({x:x0,y:y0},{x:x0,y:y0+24},{x:x1,y:y1-24},{x:x1,y:y1}, hw)}"/>`);
    o.push(`<g class="ua-tag" transform="translate(${x1},${y1})">
      <rect x="-6" y="0" width="126" height="17" rx="2"/>
      <text x="2" y="12.5">UNACCOUNTED ${fmt(Math.abs(bal.gap))} t C</text></g>`);
  }
  o.push(`</g>`);

  /* Findings: hexagon markers on straight off-grid leaders. Orthogonal leaders would
     read as piping; a plain circle would read as an ISA instrument bubble. */
  o.push(`<g class="finds layer" data-layer="findings">`);
  const anchored = audit.findings
    .map((f, i) => ({ f, i, id: (f.nodes || [])[0] }))
    .filter(a => a.id && lay.pos.has(a.id))
    .map(a => ({ ...a, p: lay.pos.get(a.id) }))
    .sort((a, b) => a.p.x - b.p.x || a.p.y - b.p.y);

  const taken = [];
  for (const { f, i, p } of anchored) {
    const ax = p.x + p.w * 0.5, ay = p.y - 1;
    let mx = ax + 22, my = p.y - 19;
    /* Nudge right until the marker clears the ones already placed. */
    while (taken.some(t => Math.abs(t.x - mx) < 26 && Math.abs(t.y - my) < 22)) mx += 26;
    taken.push({ x: mx, y: my });

    const hex = [];
    for (let k = 0; k < 6; k++) {
      const a = Math.PI / 180 * (60 * k - 90);
      hex.push(`${(mx + 11 * Math.cos(a)).toFixed(1)},${(my + 11 * Math.sin(a)).toFixed(1)}`);
    }
    o.push(`<g class="find tier-${RANK[f.severity].tier}" data-find="${i}">
      <path class="ldr-halo" d="M${ax},${ay} L${mx},${my}"/>
      <path class="ldr" d="M${ax},${ay} L${mx},${my}"/>
      <path class="hexh" d="M${hex.join(' L')} Z"/>
      <path class="hex" d="M${hex.join(' L')} Z"/>
      <text x="${mx}" y="${my + 3.4}">${i + 1}</text>
      <title>${esc(RANK[f.severity].word + ' — ' + f.title)}</title></g>`);
  }
  o.push(`</g>`);

  /* Installation block, top right: who, where, under which plan, for which period. */
  const inst = model.installation, rp = inst.reporting_period || {};
  const ibW = 372, ibH = 93;
  const ibX = lay.width - PAD - ibW, ibY = PAD;
  const rows = [
    ['OPERATOR', (inst.operator || '—').replace(/\s*\(.*?\)\s*$/, '')],
    ['LOCATION', [inst.city, inst.country].filter(Boolean).join(', ') + (inst.unlocode ? ` · ${inst.unlocode}` : '')],
    ['MONITORING PLAN', `v${inst.monitoring_plan_version || '—'}${inst.monitoring_plan_date ? ` · ${inst.monitoring_plan_date}` : ''}`],
    ['REPORTING PERIOD', model.period_loaded ? `${rp.start || '—'} to ${rp.end || '—'}` : 'no period loaded']
  ];
  o.push(`<g class="titleblock" transform="translate(${ibX},${ibY})">`);
  o.push(`<rect x="0" y="0" width="${ibW}" height="${ibH}"/>`);
  o.push(`<line x1="0" y1="24" x2="${ibW}" y2="24"/>`);
  o.push(`<text class="t-name" x="8" y="16">${esc(inst.name)}</text>`);
  rows.forEach(([k, v], i) => {
    o.push(`<text class="t-k" x="8" y="${38 + i * 15}">${esc(k)}</text>`);
    o.push(`<text class="t-v" x="112" y="${38 + i * 15}">${esc(v)}</text>`);
  });
  o.push(`</g>`);

  o.push(`</g></svg>`);
  return o.join('\n');
}

/* ---------- application ---------- */

/* PLAN and PERIOD are the two documents on the table; MODEL is their join (model.js),
   the one object every renderer and the audit engine read. */
let PLAN = null, PERIOD = null, MODEL = null, AUDIT = null, LAY = null, ZOOM = 1;
/* Which production process the plan panel is showing: null = the whole installation. */
let PLAN_PP = null;
/* Which document the left panel shows: the plan, or the period as the template's sheets. */
let DOC_VIEW = 'plan';

function show(plan, period) {
  PLAN = plan;
  PERIOD = period || null;
  const model = joinModel(PLAN, PERIOD);
  MODEL = model;
  AUDIT = auditInstallation(model);
  LAY = layout(model);

  document.title = `${model.installation.name} — CBAM Installation Blueprint`;

  try { const v = localStorage.getItem('bp.pp'); PLAN_PP = v && (model.production_processes || []).some(p => p.id === v) ? v : null; } catch (e) { PLAN_PP = null; }
  try { const d = localStorage.getItem('bp.doc'); if (d === 'plan' || d === 'period') DOC_VIEW = d; } catch (e) {}
  renderDocStatus();
  renderFindings();
  renderStreams();
  renderPlanTabs();
  renderPlan();
  /* The drawing set decides which sheet is on the table; it renders, binds and fits. */
  openSheet(initSheets());
}

/* Header line: which plan version is on the sheet and which period, if any, is joined to it. */
function renderDocStatus() {
  const host = document.getElementById('docs');
  if (!host) return;
  const mp = PLAN.monitoring_plan || {};
  const rp = PERIOD ? PERIOD.reporting_period : null;
  host.innerHTML =
    `<span class="doc" title="Monitoring plan: the installation's structure"><span class="dk">PLAN</span> v${esc(mp.version || '—')}${mp.date ? ` · ${esc(mp.date)}` : ''}</span>` +
    (rp
      ? `<span class="doc" title="Reporting period joined to the plan"><span class="dk">PERIOD</span> ${esc(rp.start)} to ${esc(rp.end)}</span>`
      : `<span class="doc none" title="Open a period file to fill the sheet with values"><span class="dk">PERIOD</span> none loaded</span>`);
}

/* Both sheets zoom and pan the same way (sheets.js); these serve the header buttons. */
function applyZoom(z) { sheetZoom(z > ZOOM ? 0.8 : 1.25); }
function fitZoom() { fitSheet(); }

function renderFindings() {
  const tiers = { 1: 0, 2: 0, 3: 0 };
  AUDIT.findings.forEach(f => tiers[RANK[f.severity].tier]++);
  document.getElementById('summary').innerHTML =
    [[1, 'BLOCKING'], [2, 'MATERIAL'], [3, 'OBSERVATION']]
      .map(([t, w]) => `<span class="pill p${t}"><b>${tiers[t]}</b>${w}</span>`).join('');

  document.getElementById('findings').innerHTML = AUDIT.findings.map((f, i) => `
    <li class="finding tier-${RANK[f.severity].tier}" data-finding="${i}">
      <div class="f-top"><span class="f-id">F-${String(i + 1).padStart(2, '0')}</span>
        <span class="f-rank">${RANK[f.severity].word}</span></div>
      <div class="f-title">${esc(f.title)}</div>
      <div class="f-detail">${esc(f.detail)}</div>
      <div class="f-refs">${f.refs.map(r => `<code>${esc(r)}</code>`).join(' ')}</div>
    </li>`).join('');
  document.querySelectorAll('.finding').forEach(li =>
    li.addEventListener('click', () => pickFinding(+li.dataset.finding)));
}

function pickFinding(i) {
  const f = AUDIT.findings[i];
  document.querySelectorAll('.finding').forEach(x => x.classList.toggle('active', +x.dataset.finding === i));
  document.querySelectorAll('#diagram [data-find]').forEach(g => g.classList.toggle('lit', +g.dataset.find === i));
  highlight(f.nodes || []);
  if (f.nodes && f.nodes.length) renderDetail(MODEL.nodes.find(n => n.id === f.nodes[0]));
  const li = document.querySelector(`.finding[data-finding="${i}"]`);
  if (li) li.scrollIntoView({ block: 'nearest' });
}

function renderStreams() {
  const byId = new Map(MODEL.nodes.map(n => [n.id, n]));
  const rows = [...MODEL.flows].sort((a, b) => (a.stream_no || 0) - (b.stream_no || 0)).map(f => {
    const q = f.quantity && f.quantity.value != null ? `${fmt(f.quantity.value)} ${f.quantity.unit || ''}` : '—';
    const c = !MODEL.period_loaded ? '<span class="dim">—</span>'
            : f.carbon_t == null ? '<span class="nd-cell">not determined</span>' : fmt(f.carbon_t);
    const ins = (f.instrument_ids || []).join(', ') || '<span class="nd-cell">none</span>';
    return `<tr data-streamrow="${f.id}"><td class="mono">${f.stream_no ?? ''}</td>
      <td>${esc(f.label || f.kind)}</td>
      <td class="dim">${esc((byId.get(f.from) || {}).name || '')} → ${esc((byId.get(f.to) || {}).name || '')}</td>
      <td class="num">${q}</td><td class="num">${c}</td><td class="mono dim">${ins}</td></tr>`;
  }).join('');
  document.getElementById('streams-body').innerHTML =
    `<table><thead><tr><th>No.</th><th>Stream</th><th>From → to</th><th class="num">Quantity</th>` +
    `<th class="num">t C</th><th>Instrument</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll('[data-streamrow]').forEach(tr =>
    tr.addEventListener('click', () => litFlow(tr.dataset.streamrow)));
}

/* The monitoring plan, written from the model: the A.5 items that describe the
   installation (2, 3, 4, 7(b), 9, 14, 17). Blueprint → plan text is one direction of
   the translation; this is its first, read-only form. */
/* Nodes that belong to a production process: assigned to it, or attributed to it by a split. */
function ppMembers(pid) {
  const ids = new Set();
  for (const n of MODEL.nodes) {
    if (n.production_process === pid || (n.attribution_split && n.attribution_split[pid] != null)) ids.add(n.id);
  }
  /* Shared utilities (grid import, heat export) belong to no process; they join every process one of their streams touches. */
  for (const n of MODEL.nodes) {
    if (n.production_process || n.attribution_split) continue;
    if (MODEL.flows.some(f => (f.from === n.id && ids.has(f.to)) || (f.to === n.id && ids.has(f.from)))) ids.add(n.id);
  }
  return ids;
}

/* Filter the sheet and the stream table to the selected process by dimming everything else. */
function applyProcessFilter() {
  const pid = PLAN_PP;
  const members = pid ? ppMembers(pid) : null;
  const inPP = id => !members || members.has(id);
  const flowIn = f => inPP(f.from) || inPP(f.to);
  const flowById = new Map(MODEL.flows.map(f => [f.id, f]));
  document.body.classList.toggle('pp-filtered', !!pid);
  document.querySelectorAll('#diagram [data-node]').forEach(g => g.classList.toggle('pp-dim', !inPP(g.dataset.node)));
  document.querySelectorAll('#diagram [data-flow]').forEach(p => p.classList.toggle('pp-dim', !flowIn(flowById.get(p.dataset.flow) || {})));
  document.querySelectorAll('#diagram .boundary').forEach(b => b.classList.toggle('pp-dim', !!pid && b.dataset.pp !== pid));
  document.querySelectorAll('#diagram .find').forEach(g => {
    const f = AUDIT.findings[+g.dataset.find] || {};
    g.classList.toggle('pp-dim', !!pid && !(f.nodes || []).some(inPP));
  });
  document.querySelectorAll('[data-streamrow]').forEach(tr => tr.classList.toggle('pp-dim', !flowIn(flowById.get(tr.dataset.streamrow) || {})));
}

function renderPlanTabs() {
  const pps = MODEL.production_processes || [];
  const goods = MODEL.nodes.filter(n => n.kind === 'good' && n.is_cbam_good !== false);
  const host = document.getElementById('plan-tabs');
  if (pps.length < 2) { host.innerHTML = ''; return; }
  const cns = pid => [...new Set(goods.filter(g => g.production_process === pid).map(g => g.cn_code).filter(Boolean))];
  host.innerHTML =
    `<button class="pptab" data-pp="" aria-pressed="${PLAN_PP ? 'false' : 'true'}" title="The whole installation: every production process">` +
    `<span class="pp-n">Installation</span><span class="pp-cn">${pps.length} production processes</span></button>` +
    pps.map(p => `<button class="pptab" data-pp="${esc(p.id)}" aria-pressed="${PLAN_PP === p.id ? 'true' : 'false'}" ` +
      `title="Only the plan elements that concern ${esc(p.name.toLowerCase())}">` +
      `<span class="pp-n">${esc(p.name)}</span><span class="pp-cn">${cns(p.id).length ? 'CN ' + cns(p.id).map(esc).join(', ') : 'no CBAM good'}</span></button>`).join('');
  host.querySelectorAll('.pptab').forEach(b => b.addEventListener('click', () => {
    PLAN_PP = b.dataset.pp || null;
    try { localStorage.setItem('bp.pp', PLAN_PP || ''); } catch (e) {}
    renderPlanTabs();
    renderPlan();
    applyProcessFilter();
  }));
}

/* The plan sentence an element was taken from, when the model carries provenance. */
function quoteOf(item) {
  const s = item && item.source;
  if (!s || !s.quote) return '';
  const q = s.quote.length > 160 ? s.quote.slice(0, 157).replace(/\s+\S*$/, '') + '…' : s.quote;
  return `<span class="q">${s.clause ? `<code>${esc(s.clause)}</code>` : ''}“${esc(q)}”</span>`;
}

function renderPlan() {
  renderDocTabs();
  if (DOC_VIEW === 'period') { renderPeriod(); return; }
  renderPlanBody();
}

/* PLAN | PERIOD at the top of the left panel. */
function renderDocTabs() {
  const host = document.getElementById('doc-tabs');
  if (!host) return;
  const mp = (PLAN && PLAN.monitoring_plan) || {};
  const rp = PERIOD ? PERIOD.reporting_period : null;
  host.innerHTML =
    `<button class="doctab" data-doc="plan" aria-pressed="${DOC_VIEW === 'plan'}" title="The monitoring plan, written from the plan document">Monitoring plan<span class="dt-sub">v${esc(mp.version || '—')}${mp.date ? ` · ${esc(mp.date)}` : ''}</span></button>` +
    `<button class="doctab${rp ? '' : ' none'}" data-doc="period" aria-pressed="${DOC_VIEW === 'period'}" title="The reporting period, laid out as the communication template's sheets">Reporting period<span class="dt-sub">${rp ? `${esc(rp.start)} to ${esc(rp.end)}` : 'none loaded'}</span></button>`;
  host.querySelectorAll('.doctab').forEach(b => b.addEventListener('click', () => {
    DOC_VIEW = b.dataset.doc;
    try { localStorage.setItem('bp.doc', DOC_VIEW); } catch (e) {}
    renderPlan();
  }));
  document.body.classList.toggle('period-view', DOC_VIEW === 'period');
}

function renderPlanBody() {
  const M = MODEL, inst = M.installation, rp = inst.reporting_period || {};
  const allPps = M.production_processes || [];
  const pps = PLAN_PP ? allPps.filter(p => p.id === PLAN_PP) : allPps;
  const members = PLAN_PP ? ppMembers(PLAN_PP) : null;
  const inPP = n => !members || members.has(n.id);
  const byId = new Map(M.nodes.map(n => [n.id, n]));
  const instById = new Map((M.instruments || []).map(i => [i.id, i]));
  const ppName = id => (pps.find(p => p.id === id) || {}).name || id;
  const li = (n, html) => `<li data-plan-node="${n.id}">${html}${quoteOf(n)}</li>`;
  const num = v => v == null ? null : fmt(v);
  const out = [];

  const clause = (ref, title, body) =>
    out.push(`<section class="clause"><h3>${esc(title)}</h3>${body}<div class="ref">${esc(ref)}</div></section>`);

  clause('A.5(2)', 'Installation and production processes',
    `<p><b>${esc(inst.name)}</b>${inst.operator ? `, operated by ${esc(inst.operator)}` : ''}, at ${esc([inst.city, inst.country].filter(Boolean).join(', '))}` +
    `${inst.coordinates ? ` (${esc(inst.coordinates)})` : ''}. Monitoring plan version ${esc(inst.monitoring_plan_version || '—')}${inst.monitoring_plan_date ? `, dated ${esc(inst.monitoring_plan_date)}` : ''}` +
    `${M.period_loaded ? `; reporting period ${esc(rp.start || '—')} to ${esc(rp.end || '—')}` : ''}.</p>` +
    (PLAN_PP
      ? `<p>One of the installation's ${allPps.length} CBAM production processes: ` +
        pps.map(p => `<b>${esc(p.name.toLowerCase())}</b>${p.route ? ` (${esc(p.route.toLowerCase())})` : ''}${p.note ? '. ' + esc(p.note) : ''}`).join('') + '</p>'
      : `<p>The installation carries out ${pps.length} CBAM production process${pps.length === 1 ? '' : 'es'}: ` +
        pps.map(p => `${esc(p.name.toLowerCase())}${p.route ? ` (${esc(p.route.toLowerCase())})` : ''}`).join('; ') + '.</p>'));

  const goods = M.nodes.filter(n => n.kind === 'good' && inPP(n));
  clause('A.5(3)', 'Goods produced, by CN code',
    `<ul>${goods.map(g => li(g,
      `<b>${esc(g.name)}</b> <span class="tagm">CN ${esc(g.cn_code || '—')}</span><br>` +
      `<span class="k">${g.is_cbam_good === false ? 'non-CBAM good' : 'CBAM good'}, functional unit ${esc(g.functional_unit || 'tonne')}` +
      `${g.quantity && g.quantity.value != null ? `, ${num(g.quantity.value)} ${esc(g.quantity.unit || '')}` : ''}` +
      `${g.composition ? '; ' + Object.entries(g.composition).map(([k, v]) => `${esc(k.replace(/_/g, ' '))} ${esc(v)}`).join(', ') : ''}` +
      `; from ${esc(ppName(g.production_process).toLowerCase())}</span>`)).join('')}</ul>`);

  clause('A.5(4)', 'Production processes and routes',
    `<ul>${pps.map(p => `<li><b>${esc(p.name)}</b><br><span class="k">${esc(p.route || 'route not stated')}` +
      `${p.system_boundary_reference ? `; system boundary per ${esc(p.system_boundary_reference)}` : ''}` +
      `. Goods delivered: ${goods.filter(g => g.production_process === p.id).map(g => esc(g.name)).join(', ') || 'none'}.</span></li>`).join('')}</ul>`);

  const streamsOf = pid => M.nodes.filter(n => n.kind === 'source_stream' && n.cbam_relevant !== false &&
    (n.production_process === pid || (n.attribution_split && n.attribution_split[pid] != null)));
  const sourcesOf = pid => M.nodes.filter(n => n.kind === 'emission_source' && n.production_process === pid);
  const describeStream = n => {
    const cf = n.calculation_factors || {};
    const ad = n.activity_data || {};
    const parts = [];
    parts.push(esc((n.stream_type || '').replace(/_/g, ' ')));
    parts.push(n.methodology === 'none'
      ? '<span class="gapword">not monitored</span>'
      : `${esc(n.methodology)} method`);
    if (ad.value != null) parts.push(`activity data ${num(ad.value)} ${esc(ad.unit || '')} from ${esc(ad.source || 'unstated source')}`);
    else if (n.methodology !== 'none' && !M.period_loaded) parts.push(`activity data${ad.unit ? ` in ${esc(ad.unit)}` : ''} from ${esc(ad.source || 'unstated source')}`);
    else if (n.methodology !== 'none') parts.push('<span class="gapword">activity data not determined</span>');
    const f = [];
    if (cf.emission_factor != null) f.push(`EF ${cf.emission_factor} ${esc(cf.emission_factor_unit || '')}`);
    if (cf.net_calorific_value != null) f.push(`NCV ${cf.net_calorific_value} ${esc(cf.net_calorific_value_unit || '')}`);
    if (cf.oxidation_factor != null) f.push(`OF ${cf.oxidation_factor}`);
    if (cf.carbon_content != null) f.push(`carbon content ${cf.carbon_content}`);
    if (cf.biomass_fraction != null) f.push(`biomass fraction ${cf.biomass_fraction}` +
      (cf.biomass_fraction_method ? ` by ${esc(cf.biomass_fraction_method)}` : ' <span class="gapword">(method not stated)</span>'));
    if (f.length) parts.push(f.join(', '));
    if (cf.determination) parts.push(esc(cf.determination.toLowerCase()));
    const split = n.attribution_split
      ? ` Attributed ${Object.entries(n.attribution_split).map(([k, v]) => `${v} to ${esc(ppName(k).toLowerCase())}`).join(', ')}.` : '';
    return `<b>${esc(n.name)}</b><br><span class="k">${parts.join('; ')}.${split}</span>`;
  };
  clause('A.5(9)', 'Source streams and emission sources, per production process',
    pps.map(p => `<div class="sub">${esc(p.name)}</div>` +
      `<ul>${sourcesOf(p.id).map(s => li(s, `<b>${esc(s.name)}</b> <span class="tagm">${esc(s.equipment_tag || '')}</span><br><span class="k">emission source, ${esc(s.methodology || 'standard')} method${s.note ? '; ' + esc(s.note.toLowerCase().replace(/\.$/, '')) : ''}.</span>`)).join('')}` +
      `${streamsOf(p.id).map(s => li(s, describeStream(s))).join('')}</ul>`).join(''));

  const flowIn = f => !members || members.has(f.from) || members.has(f.to);
  const usedInst = new Map();
  for (const f of M.flows.filter(flowIn)) for (const id of f.instrument_ids || []) {
    if (!usedInst.has(id)) usedInst.set(id, []);
    usedInst.get(id).push(f);
  }
  clause('A.5(7)(b)', 'Measurement systems and instrument locations',
    `<ul>${[...usedInst.entries()].map(([id, flows]) => {
      const i = instById.get(id);
      if (!i) return '';
      const first = M.nodes.find(n => n.id === flows[0].from) || {};
      return `<li data-plan-node="${esc(first.id || '')}"><b>${esc(i.id)}</b> ${esc(i.name)} <span class="tagm">${isaCode(i)}</span><br>` +
        `<span class="k">${esc(i.location || 'location not stated')}; measures ${esc(i.measures || '—')}` +
        `${i.uncertainty_pct != null ? `; ±${i.uncertainty_pct} %` : ''}` +
        `${M.period_loaded ? `; calibrated ${esc(i.last_calibration || 'unknown')}` : ''}` +
        `${i.calibration_interval ? ` (${esc(i.calibration_interval.toLowerCase())}${M.period_loaded ? '' : ' calibration'})` : ''}. Streams ${flows.map(f => f.stream_no).filter(Boolean).join(', ')}.</span>${quoteOf(i)}</li>`;
    }).join('')}</ul>`);

  /* Streams the plan gives no measurement system: a structural gap, whether or not a period is loaded. */
  const unmetered = M.flows.filter(f => (f.monitored === false || (M.period_loaded && f.carbon_t == null && !(f.instrument_ids || []).length)) && flowIn(f));
  if (unmetered.length) {
    out[out.length - 1] = out[out.length - 1].replace('<div class="ref">',
      `<p style="margin-top:8px"><span class="gapword">No measurement system</span> for stream${unmetered.length === 1 ? '' : 's'} ` +
      unmetered.map(f => `${f.stream_no} (${esc(f.label || f.kind)})`).join(', ') + '.</p><div class="ref">');
  }

  const precursors = [];
  for (const g of M.nodes.filter(n => n.kind === 'good')) {
    for (const f of M.flows.filter(f => f.from === g.id)) {
      const to = byId.get(f.to);
      if (to && to.production_process && to.production_process !== g.production_process &&
          (!PLAN_PP || to.production_process === PLAN_PP)) {
        precursors.push({ g, to, f });
      }
    }
  }
  const imported = M.nodes.filter(n => n.kind === 'precursor_import' && inPP(n));
  clause('A.5(14)', 'Precursors',
    (precursors.length || imported.length)
      ? `<ul>${precursors.map(({ g, to, f }) => li(g,
          `<b>${esc(g.name)}</b> → ${esc(ppName(to.production_process).toLowerCase())}<br>` +
          `<span class="k">produced in this installation${f.quantity && f.quantity.value != null ? `; ${num(f.quantity.value)} ${esc(f.quantity.unit || '')} consumed` : ''}.</span>`)).join('')}` +
        `${imported.map(n => li(n, `<b>${esc(n.name)}</b><br><span class="k">${n.supplier ? `supplied by ${esc(n.supplier.name || '—')}, ${esc(n.supplier.country || '—')}; ${esc((n.supplier.emissions_source || '').replace(/_/g, ' '))}` : '<span class="gapword">supplier not stated</span>'}</span>`)).join('')}</ul>`
      : '<p>No precursors.</p>');

  const el = M.nodes.filter(n => (n.kind === 'electricity_import' || n.kind === 'electricity_export') && inPP(n));
  const en = M.energy || {};
  clause('A.5(17)', 'Electricity',
    `<p>${en.electricity_produced_on_site ? `Electricity is produced inside the installation${en.cogeneration ? ' by co-generation' : ' by separate generation'}.` : 'No electricity is produced inside the installation.'}` +
    `${en.note ? ' ' + esc(en.note) : ''}</p>` +
    (el.length ? `<ul>${el.map(n => li(n, `<b>${esc(n.name)}</b><br><span class="k">${n.activity_data && n.activity_data.value != null ? `${num(n.activity_data.value)} ${esc(n.activity_data.unit || '')} from ${esc(n.activity_data.source || '—')}` : '<span class="gapword">quantity not determined</span>'}${n.note ? '; ' + esc(n.note.toLowerCase().replace(/\.$/, '')) : ''}.</span>`)).join('')}</ul>` : ''));

  const finds = AUDIT.findings.filter(f => !members || (f.nodes || []).some(id => members.has(id)));
  const gaps = finds.filter(f => f.severity === 'gap').length, dbl = finds.filter(f => f.severity === 'double_counting').length;
  clause('A.5(13)', 'Diagram and system boundaries',
    `<p>The sheet to the right${PLAN_PP ? ', everything outside this process dimmed' : ''}. ` +
    `${pps.length} boundar${pps.length === 1 ? 'y' : 'ies'} drawn as chain lines; ` +
    `${gaps} data gap${gaps === 1 ? '' : 's'} and ${dbl} double counting finding${dbl === 1 ? '' : 's'} marked.</p>`);

  document.getElementById('plan-body').innerHTML = out.join('');
  document.querySelectorAll('#plan [data-plan-node]').forEach(el => {
    el.addEventListener('click', () => {
      selectNode(el.dataset.planNode, 'plan');
      flyToElement(document.querySelector(`#diagram [data-node="${el.dataset.planNode}"]`));
    });
  });
}

/* The reporting period as the communication template's sheets, written from the period
   document. Each section names the sheet it mirrors and the Annex IV item it answers; rows
   keyed to a plan element select it on the sheet, like the plan panel's entries. */
function renderPeriod() {
  const host = document.getElementById('plan-body');
  const P = PERIOD, M = MODEL;
  if (!P) { host.innerHTML = ''; return; }
  const byId = new Map(M.nodes.map(n => [n.id, n]));
  const ppName = id => ((M.production_processes || []).find(p => p.id === id) || { name: id }).name;
  const members = PLAN_PP ? ppMembers(PLAN_PP) : null;
  const inPP = id => !members || !id || members.has(id);
  const ppIn = pid => !PLAN_PP || pid === PLAN_PP;
  const n = v => v == null ? '<span class="nd-cell">—</span>' : (Math.abs(v) >= 100 ? fmt(v) : String(Math.round(v * 10000) / 10000));
  const mv = m => m && m.value != null ? `${n(m.value)}${m.unit ? ` <span class="cellref">${esc(m.unit)}</span>` : ''}` : '<span class="nd-cell">—</span>';
  const out = [];
  const clause = (ref, title, body) =>
    out.push(`<section class="clause"><h3>${esc(title)}</h3>${body}<div class="ref">${esc(ref)}</div></section>`);
  const kv = rows => `<dl class="kv">${rows.filter(r => r[1] !== undefined && r[1] !== null && r[1] !== '').map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`;

  /* head: what this period is and where it came from */
  const rp = P.reporting_period || {}, ref = P.plan_ref || {}, tpl = P.template || {}, imp = P.import_report;
  const mismatch = ref.version && M.installation.monitoring_plan_version && ref.version !== M.installation.monitoring_plan_version;
  clause('A_InstData 1–2 · Annex IV 1, 8', 'Reporting period',
    kv([
      ['Period', `<b>${esc(rp.start || '—')}</b> to <b>${esc(rp.end || '—')}</b>`],
      ['Reported under plan', `v${esc(ref.version || '—')}${ref.date ? ` · ${esc(ref.date)}` : ''}${mismatch ? ` <span class="gapword">— the loaded plan is v${esc(M.installation.monitoring_plan_version)}</span>` : ''}`],
      ['Installation', esc((P.installation_ref || {}).name || M.installation.name || '—')],
      ['Template', tpl.version ? `${esc(tpl.name || 'communication template')} v${esc(tpl.version)}${tpl.date ? ` · ${esc(tpl.date)}` : ''}` : 'not filed on a template'],
      imp ? ['Imported', `${esc(imp.source_file || '')}${imp.imported ? `, ${esc(imp.imported.slice(0, 10))}` : ''}; ${imp.matched ?? 0} rows matched` +
        `${(imp.unmatched || []).length ? `, <span class="gapword">${imp.unmatched.length} unmatched</span>` : ''}`] : []
    ]));

  /* A: the lists */
  const A = P.A || {};
  const goodsRows = (A.goods || []).filter(g => inPP(g.good_id)).map(g => { const node = byId.get(g.good_id) || {}; return `<li data-plan-node="${esc(g.good_id || '')}"><b>${esc(node.name || g.good_id)}</b> <span class="tagm">${esc(g.template_ref || '')}</span><br><span class="k">${esc(g.aggregated_goods_category || '')}${(g.routes || []).length ? `; ${esc(g.routes.join(', '))}` : ''}</span></li>`; });
  const procRows = (A.processes || []).filter(p => ppIn(p.production_process_id)).map(p => `<li><b>${esc(ppName(p.production_process_id))}</b> <span class="tagm">${esc(p.template_ref || '')}</span></li>`);
  const precRows = (A.purchased_precursors || []).map(p => `<li${p.node_id ? ` data-plan-node="${esc(p.node_id)}"` : ''}><b>${esc((byId.get(p.node_id) || {}).name || p.name || '—')}</b> <span class="tagm">${esc(p.template_ref || '')}</span>${p.node_id ? '' : ' <span class="gapword">not in plan</span>'}<br><span class="k">${esc(p.country || '')}</span></li>`);
  clause('A_InstData 4–5 · Annex IV 2(a), 13, 20', 'Aggregated goods categories, production processes, purchased precursors',
    `<div class="sub">Aggregated goods (a)</div><ul>${goodsRows.join('') || '<li><span class="k">none</span></li>'}</ul>` +
    `<div class="sub">Production processes (b)</div><ul>${procRows.join('') || '<li><span class="k">none</span></li>'}</ul>` +
    `<div class="sub">Purchased precursors (5)</div><ul>${precRows.join('') || '<li><span class="k">none</span></li>'}</ul>`);

  /* B: one row per source stream, the template's columns, emissions recomputed */
  const B = (P.B || {}).source_streams || [];
  const emis = r => {
    const ad = (r.activity_data || {}).value; if (ad == null || !r.method) return null;
    const ef = (r.emission_factor || {}).value, ncv = (r.net_calorific_value || {}).value, cc = (r.carbon_content || {}).value;
    const ox = (r.oxidation_factor || {}).value, bio = (r.biomass_content || {}).value, cv = (r.conversion_factor || {}).value;
    if (r.method === 'Combustion') return ef == null || ncv == null ? null : ad * ncv / 1000 * ef * (ox == null ? 1 : ox / 100) * (1 - (bio == null ? 0 : bio / 100));
    if (r.method === 'Process emissions') return ef == null ? null : ad * ef * (cv == null ? 1 : cv / 100);
    if (r.method === 'Mass Balance') return cc == null ? null : ad * cc * 44 / 12;
    return null;
  };
  const bRows = B.filter(r => inPP(r.source_stream_id)).map(r => {
    const node = byId.get(r.source_stream_id);
    const e = emis(r);
    return `<tr${r.source_stream_id ? ` data-plan-node="${esc(r.source_stream_id)}"` : ''}>` +
      `<td class="cellref">${esc((r.template_ref || '').replace('B_EmInst ', ''))}</td>` +
      `<td><b>${esc(node ? node.name : (r.name || '—'))}</b>${node ? '' : ' <span class="gapword">not in plan</span>'}<br><span class="cellref">${esc(r.method || 'not monitored')}</span></td>` +
      `<td class="n">${mv(r.activity_data)}</td><td class="n">${mv(r.net_calorific_value)}</td><td class="n">${mv(r.emission_factor)}</td>` +
      `<td class="n">${r.carbon_content ? mv(r.carbon_content) : r.oxidation_factor ? mv(r.oxidation_factor) : '<span class="nd-cell">—</span>'}</td>` +
      `<td class="n">${mv(r.biomass_content)}</td><td class="n">${e == null ? '<span class="nd-cell">—</span>' : fmt(e)}</td></tr>`;
  });
  clause('B_EmInst 1(a) · Annex IV 16(a)', 'Source streams',
    `<div style="overflow-x:auto"><table class="ptable"><thead><tr><th>row</th><th>stream · method</th><th class="n">AD</th><th class="n">NCV</th><th class="n">EF</th><th class="n">C / OxF</th><th class="n">BioC</th><th class="n">tCO2e</th></tr></thead>` +
    `<tbody>${bRows.join('')}</tbody></table></div>`);

  /* C: installation totals and data quality, as filed */
  const C = P.C || {};
  const fb = C.fuel_balance || {}, gb = C.ghg_balance || {}, dq = C.data_quality || {};
  clause('C_Emissions&Energy 1–2 · Annex IV 7, 15(c), 16(e)', 'Installation totals',
    kv([
      ['Fuel input', fb.total_fuel_input != null ? `<b>${n(fb.total_fuel_input)}</b> TJ, of which ${n(fb.direct_fuel_for_cbam_goods)} TJ to CBAM goods` : null],
      ['Direct emissions', gb.total_direct != null ? `<b>${n(gb.total_direct)}</b> tCO2e${gb.biomass_emissions ? ` (${n(gb.biomass_emissions)} tCO2 biomass, zero-rated)` : ''}` : null],
      ['Indirect emissions', gb.total_indirect != null ? `<b>${n(gb.total_indirect)}</b> tCO2e` : null],
      ['Total', gb.total != null ? `<b>${n(gb.total)}</b> tCO2e` : null],
      ['Data quality', dq.general ? esc(dq.general) : null],
      ['Default values', dq.default_values_justification ? esc(dq.default_values_justification) : null],
      ['Quality assurance', dq.quality_assurance ? esc(dq.quality_assurance) : null]
    ]));

  /* D: per production process */
  const D = (P.D || {}).processes || [];
  const dBlocks = D.filter(r => ppIn(r.production_process_id)).map(r => {
    const h = r.measurable_heat, wg = r.waste_gases, el = r.electricity, ex = r.electricity_exported;
    return `<div class="sub">${esc(ppName(r.production_process_id))} <span class="tagm">${esc(r.template_ref || '')}</span></div>` + kv([
      ['Production', (r.production_levels || []).map(l => `${n((l.amount || {}).value)} ${esc((l.amount || {}).unit || '')} ${esc(l.route || '')}`).join('; ') || (r.total_production ? mv(r.total_production) : null)],
      ['For the market', r.produced_for_market ? mv(r.produced_for_market) : null],
      ['Consumed in other processes', (r.consumed_in_processes || []).map(c => `${mv(c.amount)} in ${esc(ppName(c.production_process_id))}`).join('; ') || null],
      ['Non-CBAM goods', r.consumed_for_non_cbam_goods ? mv(r.consumed_for_non_cbam_goods) : null],
      ['DirEm*', r.directly_attributable_emissions ? `<b>${mv(r.directly_attributable_emissions)}</b>` : null],
      ['Measurable heat', h ? `${mv(h.imported)} in, ${mv(h.exported)} out; EF ${mv(h.emission_factor)}${h.note ? `<br><span class="cellref">${esc(h.note)}</span>` : ''}` : null],
      ['Waste gases', wg ? `${mv(wg.imported)} in, ${mv(wg.exported)} out; EF ${mv(wg.emission_factor)}` : null],
      ['Electricity', el ? `${mv(el.consumption)}; EF ${mv(el.emission_factor)}${el.emission_factor_source ? `<br><span class="cellref">${esc(el.emission_factor_source)}</span>` : ''}` : null],
      ['Electricity exported', ex ? `${mv(ex.amount)}; EF ${mv(ex.emission_factor)}` : null]
    ]);
  });
  clause('D_Processes · Annex IV 13, 16(a), 17, 26', 'Production levels and attributed emissions', dBlocks.join('') || '<p class="k">no process blocks</p>');

  /* E: purchased precursors */
  const E = (P.E || {}).purchased_precursors || [];
  clause('E_PurchPrec · Annex IV 20–25', 'Purchased precursors',
    E.length ? E.map(r => `<div class="sub"${r.node_id ? ` data-plan-node="${esc(r.node_id)}"` : ''}>${esc((byId.get(r.node_id) || {}).name || r.name || '—')} <span class="tagm">${esc(r.template_ref || '')}</span>${r.node_id ? '' : ' <span class="gapword">not in plan</span>'}</div>` + kv([
      ['Purchased', r.total_purchased ? mv(r.total_purchased) : null],
      ['Consumed', (r.consumed_in_processes || []).map(c => `${mv(c.amount)} in ${esc(ppName(c.production_process_id))}`).join('; ') || null],
      ['SEE direct', r.see_direct ? mv(r.see_direct) : null],
      ['SEE indirect', r.see_indirect ? mv(r.see_indirect) : null],
      ['Source', r.source ? esc(r.source) : null],
      ['Justification', r.default_values_justification ? esc(r.default_values_justification) : null]
    ])).join('') : '<p class="k">No purchased precursors.</p>');

  /* Summary_Products: what the declarants receive */
  const S = (P.Summary_Products || []).filter(r => inPP(r.good_id));
  const sRows = S.map(r => {
    const node = byId.get(r.good_id);
    const q = r.qualifying_parameters || {};
    const af = r.as_filed;
    return `<tr${r.good_id ? ` data-plan-node="${esc(r.good_id)}"` : ''}>` +
      `<td class="cellref">${esc((r.template_ref || '').replace('Summary_Products ', ''))}</td>` +
      `<td><b>${esc(r.product_name || (node || {}).name || '—')}</b>${node ? '' : ' <span class="gapword">not in plan</span>'}<br><span class="cellref">CN ${esc(r.cn_code || '')}${r.production_process_id ? ` · ${esc(ppName(r.production_process_id))}` : ''}</span></td>` +
      `<td class="n">${mv(r.see_direct)}</td><td class="n">${mv(r.see_indirect)}</td><td class="n"><b>${mv(r.see_total)}</b></td>` +
      `<td class="n">${r.default_value_share != null ? `${Math.round(r.default_value_share * 100)} %` : '<span class="nd-cell">—</span>'}</td>` +
      `<td>${Object.entries(q).map(([k, v]) => `${esc(k.replace(/_/g, ' '))} ${esc(v)}`).join('; ') || '<span class="nd-cell">—</span>'}${af ? `<br><span class="cellref">as filed: ${af.see_total != null ? n(af.see_total) + ' tCO2e/t' : 'no computed values'}</span>` : ''}</td></tr>`;
  });
  clause('Summary_Products · Annex IV 15', 'Specific embedded emissions per good',
    `<div style="overflow-x:auto"><table class="ptable"><thead><tr><th>row</th><th>good</th><th class="n">SEE direct</th><th class="n">SEE indirect</th><th class="n">SEE total</th><th class="n">defaults</th><th>qualifying parameters</th></tr></thead>` +
    `<tbody>${sRows.join('')}</tbody></table></div>`);

  const un = P.import_report && P.import_report.unmatched || [];
  if (un.length) {
    clause('import_report', 'Workbook rows the plan does not name',
      `<ul>${un.map(u => `<li><b>${esc(u.name || '—')}</b> <span class="tagm">${esc(u.template_ref || u.sheet || '')}</span><br><span class="k">${esc(u.reason || '')}</span></li>`).join('')}</ul>`);
  }

  host.innerHTML = out.join('');
  document.querySelectorAll('#plan [data-plan-node]').forEach(el => {
    if (!el.dataset.planNode) return;
    el.addEventListener('click', () => {
      selectNode(el.dataset.planNode, 'plan');
      flyToElement(document.querySelector(`#diagram [data-node="${el.dataset.planNode}"]`));
    });
  });
}

function litFlow(id) {
  document.querySelectorAll('#diagram [data-flow]').forEach(p => p.classList.toggle('lit', p.dataset.flow === id));
  document.querySelectorAll('[data-streamrow]').forEach(tr => tr.classList.toggle('active', tr.dataset.streamrow === id));
}

function highlight(ids) {
  document.querySelectorAll('#diagram [data-node]').forEach(g => g.classList.toggle('lit', ids.includes(g.dataset.node)));
}
/* One selection, three views: the sheet, the plan panel and the detail panel all follow it.
   from = 'plan' when the click came from the plan panel, so the panel is not scrolled under the cursor. */
function selectNode(id, from) {
  highlight([id]);
  renderDetail(MODEL.nodes.find(n => n.id === id));
  let first = null;
  document.querySelectorAll('#plan [data-plan-node]').forEach(x => {
    const on = x.dataset.planNode === id;
    x.classList.toggle('active', on);
    if (on && !first) first = x;
  });
  if (first && from !== 'plan' && first.scrollIntoView) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderDetail(node) {
  const el = document.getElementById('detail');
  if (!node) { el.innerHTML = ''; return; }
  const rows = [];
  const add = (k, v, raw) => { if (v !== undefined && v !== null && v !== '') rows.push([k, v, raw]); };
  add('Kind', KIND_LABEL[node.kind] || node.kind);
  add('Tag', node.equipment_tag);
  const pp = (MODEL.production_processes || []).find(p => p.id === node.production_process);
  add('Production process', pp ? pp.name : (node.attribution_split ? 'shared — see attribution' : '—'));
  if (node.attribution_split) add('Attribution', Object.entries(node.attribution_split)
    .map(([k, v]) => `${((MODEL.production_processes || []).find(p => p.id === k) || { name: k }).name}: ${v}`).join(', '));
  add('Stream type', node.stream_type && node.stream_type.replace(/_/g, ' '));
  add('Methodology', node.methodology === 'none' ? 'not monitored' : node.methodology);
  if (node.activity_data) add('Activity data', node.activity_data.value == null
    ? (MODEL.period_loaded ? `not determined (${node.activity_data.source || 'no source'})`
                           : `${node.activity_data.source || 'source not stated'}${node.activity_data.unit ? `, in ${node.activity_data.unit}` : ''} — value comes with a period`)
    : `${fmt(node.activity_data.value)} ${node.activity_data.unit || ''} — ${node.activity_data.source || ''}`);
  if (node.template_ref) add('Template row', node.template_ref);
  const cf = node.calculation_factors || {};
  add('Emission factor', cf.emission_factor != null ? `${cf.emission_factor} ${cf.emission_factor_unit || ''}` : null);
  add('Net calorific value', cf.net_calorific_value != null ? `${cf.net_calorific_value} ${cf.net_calorific_value_unit || ''}` : null);
  add('Oxidation factor', cf.oxidation_factor);
  add('Carbon content', cf.carbon_content);
  add('Biomass fraction', cf.biomass_fraction != null
    ? `${cf.biomass_fraction}${cf.biomass_fraction_method ? '' : ' — no method stated'}` : null);
  add('Determination', cf.determination);
  add('CN code', node.cn_code);
  add('Quantity', node.quantity && node.quantity.value != null ? `${fmt(node.quantity.value)} ${node.quantity.unit || ''}` : null);
  const bal = AUDIT.balances.get(node.id);
  if (bal && bal.status === 'no_period') {
    add('Balance', 'no period loaded');
  } else if (bal) {
    add('Carbon in', `${fmt(bal.in)} t C`);
    add('Carbon out', `${fmt(bal.out)} t C`);
    add('Balance', bal.status === 'closed' ? 'closes'
      : bal.status === 'open' ? `${bal.gap > 0 ? '+' : '−'}${fmt(Math.abs(bal.gap))} t C unaccounted` : 'cannot be closed');
  }
  const insts = (node.instrument_ids || []).map(i => (MODEL.instruments || []).find(x => x.id === i)).filter(Boolean);
  add('Instruments', insts.length
    ? insts.map(i => `<b>${isaCode(i)}</b> ${esc(i.id)} — ${esc(i.name)}, ${esc(i.location || '')}` +
        `${i.uncertainty_pct != null ? `, ±${i.uncertainty_pct}%` : ''}${MODEL.period_loaded ? `, calibrated ${esc(i.last_calibration || 'unknown')}` : ''}`).join('<br>')
    : (node.kind === 'source_stream' ? 'none' : null), true);
  add('Regulation', (node.regulation_refs || []).map(r => `<code>${esc(r)}</code>`).join(' '), true);
  if (node.source && node.source.quote) add('Plan source',
    `${node.source.clause ? `<code>${esc(node.source.clause)}</code> ` : ''}<span class="quote">“${esc(node.source.quote)}”</span>`, true);
  add('Note', node.note);

  el.innerHTML = `<h3>${esc(node.name)}</h3><dl>` +
    rows.map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join('') + `</dl>`;
}

/* A dropped or opened file is a plan, a period, or a combined 0.1 model. A plan replaces the
   plan and drops the period (its ids belong to the old plan); a period joins the current plan. */
function loadDocument(doc) {
  const t = docType(doc);
  if (t === 'plan') show(doc, null);
  else if (t === 'period') {
    if (!PLAN) throw new Error('open a monitoring plan first, then the period');
    show(PLAN, doc);
  } else if (t === 'legacy') {
    const s = splitLegacy(doc);
    show(s.plan, s.period);
  } else throw new Error('not a plan, a period, or a combined model (document_type missing)');
}

function loadFile(file) {
  const r = new FileReader();
  r.onload = () => { try { loadDocument(JSON.parse(r.result)); } catch (e) { alert('Cannot open this file: ' + e.message); } };
  r.readAsText(file);
}

/* Plan text -> model, through the local server. The block only appears when the server answers,
   so the hosted standalone page (no server, no key) simply never shows it. */
function initTranslate() {
  const sec = document.getElementById('plan-src');
  const body = document.getElementById('src-body');
  const toggle = document.getElementById('src-toggle');
  const status = document.getElementById('src-status');
  const text = document.getElementById('src-text');
  const run = document.getElementById('src-run');
  const file = document.getElementById('src-file');
  if (!sec) return;

  const say = (msg, cls) => { status.textContent = msg; status.className = 'src-status' + (cls ? ' ' + cls : ''); };

  fetch('/translate', { cache: 'no-store' }).then(r => r.ok && /json/.test(r.headers.get('content-type') || '') ? r.json() : null).then(j => {
    if (!j) return;
    sec.hidden = false;
    if (!j.available) { say('server running, GEMINI_API_KEY not set', 'err'); run.disabled = true; }
  }).catch(() => {});

  let open = false;
  try { open = localStorage.getItem('bp.src-open') === '1'; } catch (e) {}
  const applyOpen = () => { body.hidden = !open; toggle.setAttribute('aria-expanded', String(open)); };
  applyOpen();
  toggle.addEventListener('click', () => { open = !open; applyOpen(); try { localStorage.setItem('bp.src-open', open ? '1' : '0'); } catch (e) {} });

  try { const saved = localStorage.getItem('bp.src-text'); if (saved) text.value = saved; } catch (e) {}
  text.addEventListener('input', () => { try { localStorage.setItem('bp.src-text', text.value); } catch (e) {} });

  file.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let v = String(rd.result);
      if (/^\s*</.test(v)) {  /* HTML: show the readable text, the server strips markup anyway */
        const doc = new DOMParser().parseFromString(v, 'text/html');
        doc.querySelectorAll('script,style').forEach(e => e.remove());
        v = (doc.body ? doc.body.innerText : doc.documentElement.textContent).replace(/\n{3,}/g, '\n\n').trim();
      }
      text.value = v; text.dispatchEvent(new Event('input')); say(`loaded ${f.name}`);
    };
    rd.readAsText(f);
  });

  let busy = false;
  const translate = async () => {
    if (busy) return;
    const t = text.value.trim();
    if (t.length < 40) { say('paste a plan first', 'err'); return; }
    busy = true; run.disabled = true;
    say('translating…', 'busy');
    const t0 = Date.now();
    try {
      const r = await fetch('/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) });
      const j = await r.json();
      if (!r.ok || j.error) { say(j.error || `server error ${r.status}`, 'err'); return; }
      if (j.problems && j.problems.length) {
        say(`model rejected: ${j.problems[0]}${j.problems.length > 1 ? ` (+${j.problems.length - 1} more)` : ''}`, 'err');
        console.warn('translate problems', j.problems);
        return;
      }
      /* A translated plan has its own ids; no loaded period can belong to it. */
      show(j.model, null);
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      const gaps = j.provenance_gaps ? `, ${j.provenance_gaps} without a plan quote` : '';
      say(`sheet from plan: ${j.model.nodes.length} elements, ${j.model.flows.length} streams in ${secs} s${gaps}`);
    } catch (e) {
      say(`no answer from the server (${e.message})`, 'err');
    } finally {
      busy = false; run.disabled = false;
    }
  };
  run.addEventListener('click', translate);
  text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); translate(); } });
}

function init() {
  document.getElementById('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  document.getElementById('zoom-out').addEventListener('click', () => applyZoom(ZOOM / 1.25));
  document.getElementById('zoom-in').addEventListener('click', () => applyZoom(ZOOM * 1.25));
  document.getElementById('zoom-fit').addEventListener('click', fitZoom);
  window.addEventListener('resize', () => { if (LAY) fitSheet(); });
  /* View toggles. Remembered per browser as a convenience; the page must work without storage. */
  const views = [['toggle-plan', 'hide-plan'], ['toggle-aside', 'hide-aside'], ['toggle-streams', 'hide-streams']];
  for (const [btnId, cls] of views) {
    const btn = document.getElementById(btnId);
    let hidden = false;
    try { hidden = localStorage.getItem(cls) === '1'; } catch (e) {}
    const apply = () => {
      document.body.classList.toggle(cls, hidden);
      btn.setAttribute('aria-pressed', String(!hidden));
    };
    apply();
    btn.addEventListener('click', () => {
      hidden = !hidden;
      apply();
      try { localStorage.setItem(cls, hidden ? '1' : '0'); } catch (e) {}
      if (LAY) fitZoom();
    });
  }

  initTranslate();

  /* Resizable regions share one grip routine. Sizes are remembered per browser. */
  const root = document.documentElement;
  const makeGrip = (gripId, cssVar, storeKey, axis, sign, min, max) => {
    const grip = document.getElementById(gripId);
    const set = v => root.style.setProperty(cssVar, `${Math.round(v)}px`);
    try { const v = parseInt(localStorage.getItem(storeKey), 10); if (v > 0) set(v); } catch (e) {}
    grip.addEventListener('pointerdown', e => {
      const start = axis === 'x' ? e.clientX : e.clientY;
      const startSize = parseFloat(getComputedStyle(root).getPropertyValue(cssVar));
      grip.setPointerCapture(e.pointerId);
      grip.classList.add('dragging');
      const move = ev => {
        const now = axis === 'x' ? ev.clientX : ev.clientY;
        set(Math.min(max(), Math.max(min, startSize + sign * (now - start))));
      };
      const up = () => {
        grip.classList.remove('dragging');
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        try { localStorage.setItem(storeKey, parseInt(root.style.getPropertyValue(cssVar), 10)); } catch (err) {}
        if (LAY) fitZoom();
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      e.preventDefault();
    });
  };
  makeGrip('streams-grip', '--streams-h', 'streams-h', 'y', -1, 90, () => innerHeight * 0.85);
  makeGrip('plan-grip',    '--plan-w',    'plan-w',    'x',  1, 220, () => innerWidth * 0.5);
  makeGrip('side-grip',    '--side-w',    'side-w',    'x', -1, 260, () => innerWidth * 0.5);

  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  if (window.EMBEDDED_PLAN) { show(window.EMBEDDED_PLAN, window.EMBEDDED_PERIOD || null); return; }
  if (window.EMBEDDED_MODEL) { loadDocument(window.EMBEDDED_MODEL); return; }
  const get = p => fetch(p, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  Promise.all([get('../examples/ornek_cimento_plan.json'), get('../examples/ornek_cimento_2026.json')]).then(([plan, period]) => {
    if (plan) show(plan, period);
  });
}

/* The artifact host injects this page after the document has loaded, so waiting
   for DOMContentLoaded would wait forever. */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
