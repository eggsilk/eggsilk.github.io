<script>/* Sheet 02 — the kiln system at drawing scale.

   A parametric elevation of a precalciner kiln line: preheater tower, riser and
   calciner, kiln inlet, rotary tube on its piers, hood and burner, grate cooler,
   tertiary air duct, cooler vent. The geometry is a template; what the PLAN states
   drives it (stage count, calciner, bypass, cooler type, where each stream enters,
   where each instrument sits). Anything the plan does not state is drawn as a ghost
   with a NOT STATED note — the sheet never asserts more than the document does.

   Conventions kept from sheet 01: ISO 10628 three-tier line weights, tags outside
   symbols, numbered streams keyed to the table, ribbon width = carbon, positive
   marks for absence, hexagons for findings. Gas rises and meal falls in the tower;
   the feed end of the kiln is the high end; the cooler sits at the burner end. */

var KS = {
  W: 1420, H: 790, FRAME: 12,
  riserX: 255, towerTop: 72, towerBottom: 400,
  calcTop: 428, calcBot: 506, calcHalfW: 22,
  inletTop: 512, inletBot: 548, inletRight: 305,
  kilnX0: 305, kilnX1: 935, kilnY0: 530, kilnY1: 560, kilnR: 22,
  hoodX0: 935, hoodX1: 980, hoodTop: 498,
  coolX0: 948, coolX1: 1240, coolTop: 584, coolBot: 646,
  ground: 668,
  elevX: 132, elevTop: 118, elevBot: 612,
  leftTerm: 70, rightTerm: 1350,
  exitY: 58, feedY: 600, elecY: 650,
  tadY: 480, tadX: 1010,
  ventX: 1160, hxTop: 438, hxBot: 472, cfTop: 366, cfBot: 418, cstackTop: 250,
  coalRunY: 686, burnerX: 1062
};

/* Every anchor the model may name. Positions are filled by the drawing; `side` is
   where a terminator for that anchor belongs and `dir` the approach direction. */
var KILN_ANCHORS = [
  'feed_elevator', 'feed_inlet', 'preheater_exit', 'calciner', 'calciner_fuel',
  'kiln_inlet', 'bypass', 'kiln_drive', 'kiln_discharge', 'main_burner', 'hood',
  'cooler_inlet', 'cooler_discharge', 'cooler_vent', 'heat_recovery', 'tertiary_air'
];

/* Offset a polyline both ways into a closed polygon (mitred corners, mitre bounded).
   Used for ducts (fixed half width) and carbon ribbons (half width = tonnage). */
function polyBand(pts, half) {
  const n = pts.length;
  if (n < 2) return '';
  const norm = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = pts[i + 1].x - pts[i].x, dy = pts[i + 1].y - pts[i].y, L = Math.hypot(dx, dy) || 1;
    norm.push({ x: -dy / L, y: dx / L });
  }
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    let nx, ny;
    if (i === 0) { nx = norm[0].x; ny = norm[0].y; }
    else if (i === n - 1) { nx = norm[n - 2].x; ny = norm[n - 2].y; }
    else {
      nx = norm[i - 1].x + norm[i].x; ny = norm[i - 1].y + norm[i].y;
      const L = Math.hypot(nx, ny) || 1; nx /= L; ny /= L;
      const cos = nx * norm[i].x + ny * norm[i].y;
      const m = Math.min(1 / Math.max(cos, 0.35), 2.8);
      nx *= m; ny *= m;
    }
    left.push(`${(pts[i].x + nx * half).toFixed(1)},${(pts[i].y + ny * half).toFixed(1)}`);
    right.push(`${(pts[i].x - nx * half).toFixed(1)},${(pts[i].y - ny * half).toFixed(1)}`);
  }
  return `M${left.join(' L')} L${right.reverse().join(' L')} Z`;
}
function polyLine(pts) { return 'M' + pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L'); }
function polyMid(pts, t = 0.5) {
  let total = 0; const seg = [];
  for (let i = 0; i < pts.length - 1; i++) { const L = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y); seg.push(L); total += L; }
  let want = total * t;
  for (let i = 0; i < seg.length; i++) {
    if (want <= seg[i] || i === seg.length - 1) {
      const u = seg[i] ? Math.min(1, want / seg[i]) : 0;
      return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * u, y: pts[i].y + (pts[i + 1].y - pts[i].y) * u,
               dx: pts[i + 1].x - pts[i].x, dy: pts[i + 1].y - pts[i].y };
    }
    want -= seg[i];
  }
  return { ...pts[0], dx: 1, dy: 0 };
}
function esc2(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmt2(n) { return typeof fmt === 'function' ? fmt(n) : String(Math.round(n)); }

/* A cyclone stage in elevation: cylinder with tangential inlet from the riser, vortex
   finder returning clean gas to the riser above, cone, and a meal chute with a flap
   valve dropping to the riser below the next stage (observed on a real preheater
   diagram: stages alternate sides of one riser; gas up, meal down). */
function cyclone(o, part, cx, cy, side, s, riserX, chuteToY, label) {
  const r = 19 * s, ch = 26 * s, coh = 42 * s;
  const rx = riserX + side * 8;                       // riser wall on this side
  const top = cy - ch / 2, bot = cy + ch / 2, tip = bot + coh;
  o.push(`<g class="part" data-part="${part}" tabindex="0">`);
  o.push(`<path class="s-body" d="M${cx - r},${top} H${cx + r} V${bot} L${cx + 2.5 * s},${tip} H${cx - 2.5 * s} L${cx - r},${bot} Z"/>`);
  /* tangential inlet box from the riser */
  const ix0 = side > 0 ? rx : cx + r, ix1 = side > 0 ? cx - r : rx;
  o.push(`<path class="s-body" d="M${Math.min(ix0, ix1)},${top + 3} H${Math.max(ix0, ix1)} V${top + 15} H${Math.min(ix0, ix1)} Z"/>`);
  /* vortex finder and elbow back to the riser */
  o.push(`<path class="s-detail" d="M${cx - 4},${top} V${top - 12} H${cx + 4} V${top}"/>`);
  o.push(`<path class="s-pipe" d="M${cx},${top - 12} V${top - 22} H${rx}"/>`);
  /* meal chute to the riser below, with a flap valve */
  const cyEnd = chuteToY;
  o.push(`<path class="s-pipe" d="M${cx},${tip} L${cx},${tip + 8} L${rx},${cyEnd}"/>`);
  const vx = (cx + rx) / 2, vy = (tip + 8 + cyEnd) / 2;
  o.push(`<path class="s-detail" d="M${vx - 4},${vy - 4} L${vx + 4},${vy + 4} M${vx - 4},${vy + 4} L${vx + 4},${vy - 4}"/>`);
  o.push(`<text class="ptag fine" x="${cx + side * (r + 6)}" y="${cy + 3}" text-anchor="${side > 0 ? 'start' : 'end'}">${label}</text>`);
  o.push(`<rect class="hit" x="${Math.min(cx - r, rx) - 2}" y="${top - 24}" width="${Math.abs(cx - rx) + r + 4}" height="${tip - top + 30}"/>`);
  o.push(`</g>`);
}

function renderKilnSheet(model, audit) {
  const K = KS;
  const o = [];
  const parts = [];            // {id, name, what, typical}
  const anchors = {};          // name -> {x, y, side}
  const notes = [];            // NOT STATED marks
  const kiln = model.nodes.find(n => n.detail && n.detail.template === 'kiln_system');
  if (!kiln) return null;
  const cooler = model.nodes.find(n => n.detail && n.detail.template === 'grate_cooler') ||
                 model.nodes.find(n => n.symbol === 'cooler');
  const members = [kiln.id, cooler && cooler.id].filter(Boolean);
  const d = kiln.detail || {}, dc = (cooler && cooler.detail) || {};
  const byId = new Map(model.nodes.map(n => [n.id, n]));
  const instById = new Map((model.instruments || []).map(i => [i.id, i]));
  const part = (id, name, what, typical, extra) => parts.push({ id, name, what, typical: !!typical, ...(extra || {}) });

  const stagesStated = d.stages != null;
  const nStages = stagesStated ? d.stages : 4;
  const calcStated = d.calciner !== undefined && d.calciner !== null;
  const hasCalciner = calcStated ? d.calciner !== 'none' : true;

  o.push(`<svg id="canvas" class="sheet2" viewBox="0 0 ${K.W} ${K.H}" xmlns="http://www.w3.org/2000/svg">`);
  o.push(`<defs>
    <pattern id="hatch-gap" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hx-gap" x1="0" y1="0" x2="0" y2="6"/></pattern>
    <pattern id="hatch-cut" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hx-cut" x1="0" y1="0" x2="0" y2="5"/></pattern>
    <pattern id="hatch-ghost" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="hx-ghost" x1="0" y1="0" x2="0" y2="7"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ar" d="M0,1 L9,5 L0,9 Z"/></marker>
    <marker id="ar-gas" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="ar-gas" d="M0,1 L9,5 L0,9 Z"/></marker>
  </defs>`);
  o.push(`<rect class="frame" x="${K.FRAME + .5}" y="${K.FRAME + .5}" width="${K.W - 2 * K.FRAME - 1}" height="${K.H - 2 * K.FRAME - 1}"/>`);
  /* drawing-frame zone letters and numbers, as on a real sheet */
  for (let i = 0; i < 8; i++) {
    const x = K.FRAME + (K.W - 2 * K.FRAME) * (i + .5) / 8;
    o.push(`<text class="zone" x="${x}" y="${K.FRAME - 3}">${i + 1}</text>`);
  }
  for (let i = 0; i < 4; i++) {
    const y = K.FRAME + (K.H - 2 * K.FRAME) * (i + .5) / 4;
    o.push(`<text class="zone" x="${K.FRAME - 4}" y="${y + 3}" text-anchor="end">${'ABCD'[i]}</text>`);
  }

  /* ---------- boundary ---------- */
  const pp = (model.production_processes || []).find(p => p.id === kiln.production_process);
  o.push(`<g data-layer="boundary" class="layer">`);
  if (pp) {
    o.push(`<g class="boundary"><rect x="40" y="30" width="1340" height="676"/>` +
      `<text class="b-ref" x="1372" y="42">${esc2(pp.name)} — CBAM system boundary${pp.system_boundary_reference ? ' · ' + esc2(pp.system_boundary_reference) : ''} · continues on sheet 01</text></g>`);
  }
  o.push(`</g>`);

  /* ---------- equipment ---------- */
  o.push(`<g data-layer="equipment" class="layer">`);
  o.push(`<path class="s-ground" d="M40,${K.ground} H1380"/>`);

  /* Bucket elevator */
  part('elevator', 'Kiln feed bucket elevator', 'Lifts homogenised raw meal from grade to the top of the preheater tower.', true);
  o.push(`<g class="part" data-part="elevator" tabindex="0">`);
  o.push(`<path class="s-body" d="M${K.elevX - 8},${K.elevTop} H${K.elevX + 8} V${K.elevBot} H${K.elevX - 8} Z"/>`);
  o.push(`<circle class="s-detail" cx="${K.elevX}" cy="${K.elevTop + 8}" r="5"/><circle class="s-detail" cx="${K.elevX}" cy="${K.elevBot - 8}" r="5"/>`);
  o.push(`<path class="s-detail" d="M${K.elevX},${K.elevTop + 13} V${K.elevBot - 13}"/>`);
  o.push(`<text class="ptag fine" x="${K.elevX + 16}" y="${K.elevTop + 60}" text-anchor="end" transform="rotate(-90 ${K.elevX + 16},${K.elevTop + 60})">BUCKET ELEVATOR</text>`);
  o.push(`<rect class="hit" x="${K.elevX - 12}" y="${K.elevTop - 4}" width="24" height="${K.elevBot - K.elevTop + 8}"/></g>`);
  anchors.feed_elevator = { x: K.elevX, y: K.feedY - 8, side: 'left' };

  /* Preheater tower: riser + stages */
  part('tower', `Preheater tower, ${stagesStated ? nStages + ' stages' : 'stage count not stated'}`,
    'Suspension preheater: kiln gas rises through the cyclone stages while the meal falls through them, counter-current.', !stagesStated,
    { stated: stagesStated ? `${nStages} stages` : null });
  const stageH = (K.towerBottom - K.towerTop) / nStages;
  o.push(`<g class="part" data-part="riser" tabindex="0"><path class="s-body" d="M${K.riserX - 8},${K.towerTop} H${K.riserX + 8} V${hasCalciner ? K.calcTop : K.inletTop} H${K.riserX - 8} Z"/>` +
         `<rect class="hit" x="${K.riserX - 10}" y="${K.towerTop}" width="20" height="${(hasCalciner ? K.calcTop : K.inletTop) - K.towerTop}"/></g>`);
  part('riser', 'Riser duct', 'Carries kiln and calciner gas up through the tower.', true);
  const stageCy = k => K.towerTop + stageH * (k + 0.45);
  for (let k = 0; k < nStages; k++) {
    const side = k === 0 ? 0 : (k % 2 === 1 ? 1 : -1);
    const s = k === 0 ? 0.72 : 0.92 + 0.02 * k;
    const chuteTo = k === nStages - 1 ? (hasCalciner ? K.calcTop + 10 : K.inletTop + 6) : stageCy(k + 1) - 4;
    part(`c${k + 1}`, `Cyclone stage ${k + 1}${stagesStated ? ` of ${nStages}` : ''}`,
      k === 0 ? 'Top stage, twin cyclones for separation efficiency; gas exits to the kiln exhaust duct.' :
      k === nStages - 1 ? 'Bottom stage; meal drops into the calciner and kiln inlet.' : 'Intermediate stage.', !stagesStated);
    if (k === 0) {
      cyclone(o, 'c1', K.riserX - 34, stageCy(0), -1, s, K.riserX, chuteTo, 'C1');
      cyclone(o, 'c1', K.riserX + 34, stageCy(0), 1, s, K.riserX, chuteTo, '');
    } else {
      cyclone(o, `c${k + 1}`, K.riserX + side * 52, stageCy(k), side, s, K.riserX, chuteTo, `C${k + 1}`);
    }
  }
  if (!stagesStated) notes.push({ x: K.riserX - 120, y: K.towerTop + 6, text: 'STAGE COUNT NOT STATED', w: 150 });
  anchors.feed_inlet = { x: K.riserX - 8, y: stageCy(0) + stageH * 0.55, side: 'left' };
  anchors.preheater_exit = { x: K.riserX, y: K.towerTop, side: 'left' };
  /* exhaust duct from the riser top to the sheet edge */
  o.push(`<path class="s-duct" d="${polyBand([{ x: K.riserX, y: K.towerTop }, { x: K.riserX, y: K.exitY }, { x: K.leftTerm + 14, y: K.exitY }], 7)}"/>`);
  o.push(`<text class="plabel fine" x="${K.riserX + 14}" y="${K.exitY - 4}">KILN EXHAUST</text>`);

  /* Calciner */
  if (hasCalciner) {
    part('calciner', calcStated ? `${d.calciner === 'separate' ? 'Separate-line' : 'Inline'} precalciner` : 'Precalciner (arrangement not stated)',
      'Most of the carbonate is decarbonated here, fired by the calciner fuel with tertiary air from the cooler.', !calcStated);
    const x0 = K.riserX - K.calcHalfW, x1 = K.riserX + K.calcHalfW;
    o.push(`<g class="part ${calcStated ? '' : 'ghost'}" data-part="calciner" tabindex="0">`);
    o.push(`<path class="s-body" d="M${x0},${K.calcTop + 10} Q${x0},${K.calcTop} ${x0 + 10},${K.calcTop} H${x1 - 10} Q${x1},${K.calcTop} ${x1},${K.calcTop + 10} V${K.calcBot - 6} Q${x1},${K.calcBot} ${x1 - 6},${K.calcBot} H${x0 + 6} Q${x0},${K.calcBot} ${x0},${K.calcBot - 6} Z"/>`);
    o.push(`<path class="s-detail" d="M${x0 + 6},${K.calcTop + 26} Q${K.riserX},${K.calcTop + 14} ${x1 - 6},${K.calcTop + 26} M${x0 + 6},${K.calcTop + 46} Q${K.riserX},${K.calcTop + 34} ${x1 - 6},${K.calcTop + 46} M${x0 + 6},${K.calcTop + 66} Q${K.riserX},${K.calcTop + 54} ${x1 - 6},${K.calcTop + 66}"/>`);
    o.push(`<text class="ptag fine" x="${x1 + 8}" y="${K.calcTop + 40}">CALCINER</text>`);
    o.push(`<rect class="hit" x="${x0 - 2}" y="${K.calcTop - 2}" width="${x1 - x0 + 4}" height="${K.calcBot - K.calcTop + 4}"/></g>`);
    if (!calcStated) notes.push({ x: x1 + 8, y: K.calcTop + 46, text: 'CALCINER NOT STATED', w: 128 });
    anchors.calciner = { x: K.riserX, y: (K.calcTop + K.calcBot) / 2, side: 'left' };
    anchors.calciner_fuel = { x: x0, y: K.calcTop + 34, side: 'left' };
    anchors.tertiary_air = { x: x1, y: K.calcBot - 22, side: 'right' };
    o.push(`<path class="s-body" d="M${K.riserX - 8},${K.calcBot} H${K.riserX + 8} V${K.inletTop} H${K.riserX - 8} Z"/>`);
  } else {
    anchors.calciner_fuel = { x: K.riserX - 8, y: K.inletTop - 30, side: 'left' };
  }

  /* Kiln inlet chamber and bypass */
  part('kiln_inlet', 'Kiln inlet chamber', 'Smoke chamber where meal enters the kiln and kiln gas enters the riser; the bypass take-off sits here when there is one.', true);
  o.push(`<g class="part" data-part="kiln_inlet" tabindex="0"><path class="s-body" d="M${K.riserX - 14},${K.inletTop} H${K.inletRight} V${K.inletBot} H${K.riserX - 14} Z"/>` +
         `<text class="ptag fine" x="${K.riserX - 18}" y="${K.inletBot - 10}" text-anchor="end">KILN INLET</text>` +
         `<rect class="hit" x="${K.riserX - 16}" y="${K.inletTop - 2}" width="${K.inletRight - K.riserX + 18}" height="${K.inletBot - K.inletTop + 4}"/></g>`);
  anchors.kiln_inlet = { x: K.riserX + 20, y: K.inletTop, side: 'left' };
  if (d.bypass !== false) {
    const ghost = d.bypass == null;
    part('bypass', ghost ? 'Kiln-inlet bypass (not stated)' : 'Kiln-inlet gas bypass',
      'Take-off of part of the kiln gas before the tower, quenched and dedusted; bypass dust leaving the system carries carbonate carbon (B.9.2.3).', ghost);
    const bx = K.inletRight + 34, by0 = K.inletTop - 6, byTop = 408;
    o.push(`<g class="part ${ghost ? 'ghost' : ''}" data-part="bypass" tabindex="0">`);
    o.push(`<path class="s-pipe" d="M${K.inletRight - 4},${K.inletTop} V${by0} H${bx} V${byTop + 34}"/>`);
    o.push(`<path class="s-body" d="M${bx - 22},${byTop} H${bx + 22} V${byTop + 34} H${bx - 22} Z"/>`);
    o.push(`<path class="s-detail" d="M${bx + 22},${byTop + 17} H${bx + 40} V${byTop + 44} H${bx + 30} V${byTop + 56} H${bx + 50}"/>`);
    o.push(`<text class="ptag fine" x="${bx}" y="${byTop + 21}" text-anchor="middle">BYPASS</text>`);
    o.push(`<rect class="hit" x="${bx - 24}" y="${byTop - 2}" width="76" height="${by0 - byTop + 6}"/></g>`);
    anchors.bypass = { x: bx + 50, y: byTop + 56, side: 'right' };
    if (ghost) notes.push({ x: bx + 46, y: byTop + 6, text: 'BYPASS NOT STATED IN PLAN', w: 168 });
  }

  /* Rotary kiln */
  const kl = K.kilnX1 - K.kilnX0;
  const axis = f => ({ x: K.kilnX0 + kl * f, y: K.kilnY0 + (K.kilnY1 - K.kilnY0) * f });
  const nSup = d.supports != null ? d.supports : 3;
  part('kiln', 'Rotary kiln', `Inclined rotating tube, feed end high; ${d.supports != null ? nSup + ' support stations' : 'support stations not stated, three drawn as typical'}. Clinker forms in the burning zone at the discharge end.`, d.supports == null);
  o.push(`<g class="part" data-part="kiln" tabindex="0">`);
  const a0 = axis(0), a1 = axis(1);
  o.push(`<path class="s-body s-heavy" d="M${a0.x},${a0.y - K.kilnR} L${a1.x},${a1.y - K.kilnR} L${a1.x},${a1.y + K.kilnR} L${a0.x},${a0.y + K.kilnR} Z"/>`);
  o.push(`<path class="s-detail" d="M${a0.x},${a0.y} L${a1.x},${a1.y}" stroke-dasharray="14 4 2 4"/>`);
  /* burning zone: the only tinted region on the plant, because temperature is the point of it */
  const bz0 = axis(0.74), bz1 = axis(0.97);
  o.push(`<path class="s-hot" d="M${bz0.x},${bz0.y - K.kilnR + 1} L${bz1.x},${bz1.y - K.kilnR + 1} L${bz1.x},${bz1.y + K.kilnR - 1} L${bz0.x},${bz0.y + K.kilnR - 1} Z"/>`);
  o.push(`<text class="plabel fine" x="${axis(0.855).x}" y="${axis(0.855).y + 3}" text-anchor="middle">BURNING ZONE</text>`);
  const supFr = [];
  for (let i = 0; i < nSup; i++) supFr.push(0.2 + 0.64 * i / Math.max(1, nSup - 1));
  for (const f of supFr) {
    const a = axis(f), w = 6;
    o.push(`<path class="s-body" d="M${a.x - w},${a.y - K.kilnR - 4} H${a.x + w} V${a.y + K.kilnR + 4} H${a.x - w} Z"/>`);
    o.push(`<circle class="s-body" cx="${a.x - 9}" cy="${a.y + K.kilnR + 12}" r="7"/><circle class="s-body" cx="${a.x + 9}" cy="${a.y + K.kilnR + 12}" r="7"/>`);
    o.push(`<path class="s-body" d="M${a.x - 20},${a.y + K.kilnR + 19} H${a.x + 20} L${a.x + 26},${K.ground} H${a.x - 26} Z"/>`);
  }
  /* girth gear and drive */
  const g = axis(0.12);
  o.push(`<path class="s-hatch-fill" d="M${g.x - 5},${g.y - K.kilnR - 8} H${g.x + 5} V${g.y + K.kilnR + 8} H${g.x - 5} Z"/>`);
  o.push(`<circle class="s-body" cx="${g.x}" cy="${g.y + K.kilnR + 16}" r="6"/>`);
  o.push(`<path class="s-body" d="M${g.x - 16},${g.y + K.kilnR + 24} H${g.x + 16} V${g.y + K.kilnR + 40} H${g.x - 16} Z"/>`);
  o.push(`<text class="ptag fine" x="${g.x}" y="${g.y + K.kilnR + 35}" text-anchor="middle">M</text>`);
  o.push(`<path class="s-detail" d="M${g.x},${g.y + K.kilnR + 40} V${K.ground}"/>`);
  o.push(`<text class="ptag fine" x="${axis(0.45).x}" y="${axis(0.45).y - K.kilnR - 10}" text-anchor="middle">${esc2(kiln.equipment_tag || 'ROTARY KILN')}</text>`);
  o.push(`<rect class="hit" x="${a0.x}" y="${a0.y - K.kilnR - 10}" width="${kl}" height="${K.kilnR * 2 + 50}"/></g>`);
  anchors.kiln_drive = { x: g.x - 16, y: g.y + K.kilnR + 32, side: 'left' };
  anchors.kiln_discharge = { x: K.kilnX1 + 2, y: a1.y, side: 'right' };
  part('drive', 'Kiln drive', 'Girth gear, pinion and motor; the electricity drawn here is the kiln line feeder.', true);

  /* Hood and burner */
  part('hood', 'Kiln hood', 'Encloses the discharge end; secondary air rises from the cooler through it, tertiary air is taken from its roof.', true);
  o.push(`<g class="part" data-part="hood" tabindex="0"><path class="s-body" d="M${K.hoodX0},${K.hoodTop} H${K.hoodX1} V${K.coolTop} H${K.hoodX0 + 14} V${a1.y + K.kilnR + 6} H${K.hoodX0} Z"/>` +
         `<text class="ptag fine" x="${K.hoodX1 + 6}" y="${K.hoodTop + 14}">HOOD</text>` +
         `<rect class="hit" x="${K.hoodX0}" y="${K.hoodTop}" width="${K.hoodX1 - K.hoodX0}" height="${K.coolTop - K.hoodTop}"/></g>`);
  anchors.hood = { x: K.hoodX1, y: K.hoodTop + 30, side: 'right' };
  part('burner', 'Main burner', 'Burner pipe through the hood, firing counter-current to the material; kiln fuels enter here.', true);
  const by = a1.y;
  o.push(`<g class="part" data-part="burner" tabindex="0"><path class="s-body" d="M${K.hoodX1 - 6},${by - 5} H${K.burnerX} V${by + 5} H${K.hoodX1 - 6} Z"/>` +
         `<path class="s-detail" d="M${K.burnerX},${by - 12} V${by + 12} M${K.burnerX + 14},${by - 12} V${by + 12} M${K.burnerX - 10},${by + 12} H${K.burnerX + 24} V${K.coolTop} "/>` +
         `<path class="s-detail" d="M${K.hoodX1 - 6},${by} L${K.hoodX0 - 30},${by - 9} M${K.hoodX1 - 6},${by} L${K.hoodX0 - 30},${by + 9}"/>` +
         `<text class="ptag fine" x="${K.burnerX + 22}" y="${by - 6}">BURNER</text>` +
         `<rect class="hit" x="${K.hoodX1 - 6}" y="${by - 14}" width="${K.burnerX + 30 - K.hoodX1}" height="30"/></g>`);
  anchors.main_burner = { x: K.burnerX + 6, y: by, side: 'right' };

  /* Grate cooler */
  const coolStated = dc.type != null;
  part('cooler', coolStated ? `${dc.type.charAt(0).toUpperCase() + dc.type.slice(1)} cooler` : 'Clinker cooler (type not stated)',
    'Reciprocating grate; cooling air from the fans below becomes secondary and tertiary air, the rest is vented.', !coolStated);
  o.push(`<g class="part ${coolStated ? '' : 'ghost'}" data-part="cooler" tabindex="0">`);
  o.push(`<path class="s-body s-heavy" d="M${K.coolX0},${K.coolTop} H${K.coolX1} V${K.coolBot} H${K.coolX0} Z"/>`);
  o.push(`<path class="s-detail" d="M${K.coolX0 + 12},${K.coolTop + 22} L${K.coolX1 - 12},${K.coolTop + 40}"/>`);
  for (let i = 0; i < 12; i++) {
    const x = K.coolX0 + 18 + i * 22, y = K.coolTop + 22 + 18 * (x - K.coolX0 - 12) / (K.coolX1 - K.coolX0 - 24);
    o.push(`<path class="s-detail" d="M${x},${y} V${y + 8}"/>`);
  }
  const nFans = 5;
  for (let i = 0; i < nFans; i++) {
    const x = K.coolX0 + 30 + i * (K.coolX1 - K.coolX0 - 60) / (nFans - 1);
    o.push(`<path class="s-detail" d="M${x - 12},${K.coolBot - 14} H${x + 12} V${K.coolBot} H${x - 12} Z"/>`);
    o.push(`<circle class="s-body" cx="${x}" cy="${K.coolBot + 10}" r="7"/><path class="s-detail" d="M${x - 4},${K.coolBot + 10} H${x + 4} M${x},${K.coolBot + 6} V${K.coolBot + 14}"/>`);
  }
  o.push(`<text class="ptag fine" x="${(K.coolX0 + K.coolX1) / 2}" y="${K.coolBot + 28}" text-anchor="middle">${esc2((cooler && cooler.equipment_tag) || 'CLINKER COOLER')}</text>`);
  o.push(`<rect class="hit" x="${K.coolX0}" y="${K.coolTop}" width="${K.coolX1 - K.coolX0}" height="${K.coolBot - K.coolTop + 18}"/></g>`);
  if (!coolStated) notes.push({ x: K.coolX0 + 40, y: K.coolTop - 30, text: 'COOLER TYPE NOT STATED', w: 150 });
  /* crusher and discharge belt */
  part('crusher', 'Clinker crusher', 'Roller crusher at the cooler discharge; clinker leaves to the silo on a belt.', true);
  const cr = { x: K.coolX1 - 4, y: K.coolTop + 44 };
  o.push(`<g class="part" data-part="crusher" tabindex="0"><circle class="s-body" cx="${cr.x}" cy="${cr.y}" r="9"/><circle class="s-detail" cx="${cr.x}" cy="${cr.y}" r="4"/>` +
         `<path class="s-pipe" d="M${K.coolX1},${cr.y + 10} L${K.coolX1 + 14},${K.ground - 8}"/>` +
         `<path class="s-body" d="M${K.coolX1 + 14},${K.ground - 12} H${K.rightTerm - 24} V${K.ground - 4} H${K.coolX1 + 14} Z"/>` +
         `<rect class="hit" x="${K.coolX1 - 14}" y="${cr.y - 12}" width="${K.rightTerm - K.coolX1}" height="${K.ground - cr.y + 8}"/></g>`);
  anchors.cooler_inlet = { x: K.hoodX0 + 14, y: K.coolTop + 8, side: 'left' };
  anchors.cooler_discharge = { x: K.coolX1 + 60, y: K.ground - 8, side: 'right' };

  /* Tertiary air duct: from the hood roof back up and across to the calciner */
  if (hasCalciner) {
    part('tad', 'Tertiary air duct', 'Hot cooler air returned to the calciner as its combustion air. Drawn because a calciner cannot fire without it; the plan does not describe it.', true);
    const tad = [{ x: K.tadX, y: K.coolTop }, { x: K.tadX, y: K.tadY }, { x: K.riserX + K.calcHalfW + 6, y: K.tadY }, { x: K.riserX + K.calcHalfW + 6, y: K.calcBot - 22 }, { x: K.riserX + K.calcHalfW, y: K.calcBot - 22 }];
    o.push(`<g class="part" data-part="tad" tabindex="0"><path class="s-duct" d="${polyBand(tad, 6)}"/>` +
           `<path class="s-flow-gas fine" d="${polyLine([{ x: K.tadX, y: K.tadY + 40 }, { x: K.tadX, y: K.tadY }, { x: K.tadX - 40, y: K.tadY }])}" marker-end="url(#ar-gas)"/>` +
           `<text class="plabel fine" x="${(K.tadX + K.riserX) / 2}" y="${K.tadY - 6}" text-anchor="middle">TERTIARY AIR</text>` +
           `<path class="hit" d="${polyBand(tad, 10)}"/></g>`);
  }

  /* Cooler vent: heat exchanger, dedusting, stack */
  const hr = dc.heat_recovery === true;
  part('cooler_vent', 'Cooler exhaust', 'Excess cooling air vented through its own dedusting and stack; not a CBAM emission point for clinker.', true);
  o.push(`<g class="part" data-part="cooler_vent" tabindex="0">`);
  o.push(`<path class="s-duct" d="${polyBand([{ x: K.ventX, y: K.coolTop }, { x: K.ventX, y: hr ? K.hxBot : K.cfBot }], 5)}"/>`);
  if (hr) o.push(`<path class="s-duct" d="${polyBand([{ x: K.ventX, y: K.hxTop }, { x: K.ventX, y: K.cfBot }], 5)}"/>`);
  o.push(`<path class="s-body" d="M${K.ventX - 30},${K.cfTop} H${K.ventX + 30} V${K.cfBot} H${K.ventX - 30} Z"/>`);
  for (const f of [0.3, 0.5, 0.7]) o.push(`<path class="s-detail" d="M${K.ventX - 30 + 60 * f},${K.cfTop + 6} V${K.cfBot - 12}"/>`);
  o.push(`<path class="s-body" d="M${K.ventX - 7},${K.cfTop} L${K.ventX - 5},${K.cstackTop} H${K.ventX + 5} L${K.ventX + 7},${K.cfTop} Z"/>`);
  o.push(`<text class="ptag fine" x="${K.ventX + 36}" y="${K.cfTop + 30}">COOLER VENT</text>`);
  o.push(`<rect class="hit" x="${K.ventX - 32}" y="${K.cstackTop}" width="64" height="${K.coolTop - K.cstackTop}"/></g>`);
  anchors.cooler_vent = { x: K.ventX, y: K.cstackTop, side: 'right' };
  if (hr) {
    part('heat_recovery', 'Cooler exhaust heat exchanger', 'Recovers heat from the cooler vent air; the exported measurable heat is metered here.', false,
      { stated: 'heat recovery stated in plan' });
    o.push(`<g class="part" data-part="heat_recovery" tabindex="0"><path class="s-body" d="M${K.ventX - 26},${K.hxTop} H${K.ventX + 26} V${K.hxBot} H${K.ventX - 26} Z"/>` +
           `<path class="s-detail" d="M${K.ventX - 20},${K.hxTop + 8} H${K.ventX + 20} M${K.ventX - 20},${K.hxTop + 17} H${K.ventX + 20} M${K.ventX - 20},${K.hxTop + 26} H${K.ventX + 20}"/>` +
           `<text class="ptag fine" x="${K.ventX - 32}" y="${K.hxTop + 20}" text-anchor="end">HEAT RECOVERY</text>` +
           `<rect class="hit" x="${K.ventX - 28}" y="${K.hxTop - 2}" width="56" height="${K.hxBot - K.hxTop + 4}"/></g>`);
    anchors.heat_recovery = { x: K.ventX + 26, y: (K.hxTop + K.hxBot) / 2, side: 'right' };
  }
  /* gas-direction arrows inside the tower and kiln: gas up, meal down, counter-current */
  o.push(`<path class="s-flow-gas fine" d="M${K.riserX},${K.inletTop - 4} V${K.towerTop + 40}" marker-end="url(#ar-gas)"/>`);
  o.push(`<path class="s-flow-gas fine" d="M${axis(0.7).x},${axis(0.7).y - K.kilnR - 3} L${axis(0.3).x},${axis(0.3).y - K.kilnR - 3}" marker-end="url(#ar-gas)"/>`);
  o.push(`<text class="plabel fine" x="${axis(0.5).x}" y="${axis(0.5).y - K.kilnR - 6}" text-anchor="middle">GAS</text>`);
  o.push(`</g>`);

  /* ---------- streams ---------- */
  const anchorOf = ref => anchors[ref] || null;
  const onSheet = f => (f.attach && ((f.attach.to && members.includes(f.to)) || (f.attach.from && members.includes(f.from)))) ||
                       (members.includes(f.from) && members.includes(f.to));
  const flows = model.flows.filter(onSheet);
  const maxC = Math.max(...model.flows.map(f => f.carbon_t || 0), 1);
  const halfW = c => (c == null ? 2.4 : 0.9 + 8.5 * Math.sqrt(Math.max(c, 0) / maxC));
  const layerOf = layerOfFlow;

  /* terminator slots: left and right edges, one row per off-sheet stream */
  const termLeft = [], termRight = [];
  const routes = [];   // {flow, pts, share, note}
  const termLabel = (f, other) => {
    const n = byId.get(other) || {};
    return `${(n.name || other)}`.toUpperCase();
  };
  const list = v => v == null ? [] : (Array.isArray(v) ? v : [v]);

  for (const f of flows) {
    const tos = list(f.attach && f.attach.to), froms = list(f.attach && f.attach.from);
    const internal = members.includes(f.from) && members.includes(f.to);
    if (internal) {
      const a = anchorOf(froms[0] || 'kiln_discharge'), b = anchorOf(tos[0] || 'cooler_inlet');
      if (a && b) routes.push({ flow: f, pts: [a, { x: a.x + 8, y: a.y }, { x: b.x, y: b.y - 10 }, b], share: 1 });
      continue;
    }
    if (tos.length && members.includes(f.to)) {
      const share = f.attach.split ? null : (tos.length > 1 ? 1 / tos.length : 1);
      const fromLeft = tos.includes('calciner_fuel') || tos.includes('feed_inlet') || tos.includes('kiln_drive');
      const term = fromLeft ? termLeft : termRight;
      const slot = { flow: f, label: termLabel(f, f.from), y: 0 };
      term.push(slot);
      for (const t of tos) {
        const a = anchorOf(t);
        if (!a) continue;
        const sh = f.attach.split && f.attach.split[t] != null ? f.attach.split[t] : share;
        routes.push({ flow: f, pts: null, target: t, slot, share: sh, fromLeft, splitUnknown: tos.length > 1 && !f.attach.split });
      }
    } else if (froms.length && members.includes(f.from)) {
      const a = anchorOf(froms[0]);
      if (!a) continue;
      const toLeft = froms[0] === 'preheater_exit';
      const term = toLeft ? termLeft : termRight;
      const slot = { flow: f, label: termLabel(f, f.to), y: 0 };
      term.push(slot);
      routes.push({ flow: f, pts: null, source: froms[0], slot, share: 1, fromLeft: toLeft });
    }
  }
  /* Fixed slot rows by anchor, so the sheet stays stable across models. */
  const slotY = (r) => {
    const t = r.target || r.source;
    if (t === 'preheater_exit') return K.exitY;
    if (t === 'feed_inlet') return K.feedY;
    if (t === 'kiln_drive') return K.elecY;
    if (t === 'calciner_fuel') return 440;
    if (t === 'main_burner') return 520;
    if (t === 'heat_recovery') return 455;
    if (t === 'cooler_discharge') return K.ground - 8;
    if (t === 'cooler_vent') return K.cstackTop;
    if (t === 'bypass') return 380;
    return 300;
  };
  /* spread streams that share a slot row */
  const rowsUsed = new Map();
  const claim = (side, y, down) => {
    const key = `${side}|${y}`;
    const n = rowsUsed.get(key) || 0; rowsUsed.set(key, n + 1);
    return down ? y + n * 24 : y - n * 24;
  };
  for (const r of routes) {
    if (r.pts) continue;
    const side = r.fromLeft ? 'L' : 'R';
    if (r.slot.y === 0) r.slot.y = claim(side, slotY(r), r.source === 'preheater_exit');
    const y = r.slot.y, tx = r.fromLeft ? K.leftTerm : K.rightTerm;
    const A = anchorOf(r.target || r.source);
    if (r.target === 'feed_inlet') {
      r.pts = [{ x: tx, y }, { x: K.elevX, y }, { x: K.elevX, y: A.y - 10 }, { x: A.x, y: A.y }];
    } else if (r.target === 'calciner_fuel') {
      const py = A.y + (440 - y) * 0.5;
      r.pts = [{ x: tx, y }, { x: A.x - 40, y }, { x: A.x - 40, y: py }, { x: A.x, y: py }];
    } else if (r.target === 'main_burner') {
      if (r.fromLeft) {
        /* a left-side stream that also fires the main burner: long run under the kiln piers */
        const rx = K.burnerX + 14 + (rowsUsed.get('L|440') || 1) * 0;
        r.pts = [{ x: tx, y }, { x: 168, y }, { x: 168, y: K.coalRunY }, { x: rx, y: K.coalRunY }, { x: rx, y: A.y + 6 }, { x: A.x, y: A.y + 6 }];
      } else {
        r.pts = [{ x: tx, y }, { x: K.burnerX + 30, y }, { x: K.burnerX + 30, y: A.y - 6 }, { x: A.x, y: A.y - 6 }];
      }
    } else if (r.target === 'kiln_drive') {
      r.pts = [{ x: tx, y }, { x: 168, y }, { x: 168, y: A.y }, { x: A.x, y: A.y }];
    } else if (r.source === 'preheater_exit') {
      /* everything that leaves with the kiln gas shares the duct, then peels off to its own row */
      r.pts = y === K.exitY ? [{ x: A.x, y: A.y }, { x: A.x, y: K.exitY }, { x: tx, y: K.exitY }]
                            : [{ x: A.x, y: A.y }, { x: A.x, y: K.exitY }, { x: 176, y: K.exitY }, { x: 176, y }, { x: tx, y }];
    } else if (r.source === 'cooler_discharge') {
      r.pts = [{ x: K.coolX1 + 14, y: K.ground - 8 }, { x: tx, y }];
    } else if (r.source === 'heat_recovery') {
      r.pts = [{ x: A.x, y: A.y }, { x: tx, y }];
    } else if (r.source === 'bypass' || r.target === 'bypass') {
      r.pts = [{ x: A.x, y: A.y }, { x: A.x + 30, y: A.y }, { x: A.x + 30, y }, { x: tx, y }];
    } else {
      r.pts = [{ x: tx, y }, { x: A.x, y: A.y }];
    }
  }

  /* Draw terminators at the sheet edges, labelled with the far end and the sheet reference. */
  o.push(`<g data-layer="material" class="layer terms">`);
  const drawTerm = (slot, left) => {
    const x = left ? K.leftTerm : K.rightTerm, y = slot.y;
    /* labels sit inside the sheet, above the line: a terminator at the edge has no room outside */
    o.push(`<g class="term" data-flow="${slot.flow.id}">${terminatorMark(x, y, 7)}` +
      `<text class="tlabel halo" x="${left ? x + 12 : x - 12}" y="${y - 4}" text-anchor="${left ? 'start' : 'end'}">${esc2(slot.label)}<tspan class="tref" dx="6">01</tspan></text></g>`);
  };
  for (const s of termLeft) drawTerm(s, true);
  for (const s of termRight) drawTerm(s, false);
  o.push(`</g>`);

  /* Ribbons, one group per layer so the toggles are plain visibility. */
  const byLayer = { material: [], fuel: [], gas: [], energy: [] };
  const flowEls = new Map();  // flow id -> [element ids] for the trace
  for (const r of routes) {
    const f = r.flow, L = layerOf(f);
    let pts = r.pts;
    const gap = f.carbon_t == null;
    const c = f.carbon_t == null ? null : f.carbon_t * (r.share == null ? 0.5 : r.share);
    const cls = ['ribbon', `rb-${f.kind}`, gap ? 'rb-gap' : ''].filter(Boolean).join(' ');
    const title = gap ? `Stream ${f.stream_no}: carbon not determined`
      : `Stream ${f.stream_no} — ${f.label || f.kind}: ${fmt2(f.carbon_t)} t C${r.share != null && r.share < 1 ? ` (${Math.round(r.share * 100)} % drawn on this branch)` : ''}`;
    const energy = L === 'energy';
    byLayer[L].push(`<path class="${cls}" data-flow="${f.id}" d="${energy ? polyLine(pts) : polyBand(pts, halfW(c))}"${energy ? ' fill="none"' : ''}><title>${esc2(title)}</title></path>`);
    byLayer[L].push(`<path class="cline ${gap ? 'cl-gap' : ''}" data-flow="${f.id}" d="${polyLine(pts)}" marker-end="url(#ar)"/>`);
    r.drawn = pts;
  }
  for (const L of ['material', 'fuel', 'gas', 'energy']) {
    o.push(`<g data-layer="${L}" class="layer flows">${byLayer[L].join('')}</g>`);
  }

  /* ---------- marks: stream flags, instrument bubbles, ND, split notes ---------- */
  o.push(`<g data-layer="instruments" class="layer marks">`);
  const bubbleAt = new Map();  // anchor -> count for stacking
  const flagged = new Set(), splitNoted = new Set();
  for (const r of routes) {
    const f = r.flow, pts = r.drawn;
    if (!flagged.has(f.id)) {
      flagged.add(f.id);
      const m = polyMid(pts, r.source === 'preheater_exit' ? 0.3 : r.source ? 0.5 : 0.28);
      o.push(`<g class="flag" data-flow="${f.id}"><path d="M${m.x},${m.y - 8} L${m.x + 13},${m.y} L${m.x},${m.y + 8} L${m.x - 13},${m.y} Z"/>` +
             `<text x="${m.x}" y="${m.y + 3.2}">${f.stream_no ?? ''}</text></g>`);
    } else {
      const m = polyMid(pts, 0.55);
      o.push(`<g class="flag" data-flow="${f.id}"><path d="M${m.x},${m.y - 8} L${m.x + 13},${m.y} L${m.x},${m.y + 8} L${m.x - 13},${m.y} Z"/>` +
             `<text x="${m.x}" y="${m.y + 3.2}">${f.stream_no ?? ''}</text></g>`);
    }
    if (r.splitUnknown && !splitNoted.has(f.id)) {
      splitNoted.add(f.id);
      /* sits on the long branch, where there is room and where the split is visible */
      const long = routes.filter(x => x.flow.id === f.id).sort((a, b) => b.drawn.length - a.drawn.length)[0];
      const m = polyMid(long.drawn, 0.55);
      notes.push({ x: Math.min(1000, Math.max(52, m.x - 150)), y: m.y - 24, text: `SPLIT OF STREAM ${f.stream_no} BETWEEN FIRING POINTS NOT STATED`, w: 300, flow: f.id });
    }
    if (f.carbon_t == null) {
      const m = polyMid(pts, 0.7);
      o.push(`<g class="nd" data-flow="${f.id}"><rect x="${m.x - 13}" y="${m.y - 8}" width="26" height="16" rx="2"/><text x="${m.x}" y="${m.y + 4}">ND</text><title>Quantity never determined</title></g>`);
    }
  }
  /* Instruments sit where the model says they are mounted. Off-sheet instruments of an
     on-sheet stream are named at the terminator, so the reader knows where to look. */
  const placed = new Set();
  const bubble = (inst, x, y, flowId) => {
    o.push(`<g class="bub" data-inst="${esc2(inst.id)}" ${flowId ? `data-flow="${flowId}"` : ''}><circle cx="${x}" cy="${y}" r="10"/>` +
      `<text x="${x}" y="${y - 0.5}">${isaCode(inst)}</text><text class="bt fine" x="${x}" y="${y + 7}">${esc2(inst.id)}</text>` +
      `<title>${esc2(inst.name + ' — ' + (inst.location || ''))}</title></g>`);
  };
  for (const inst of model.instruments || []) {
    if (!inst.anchor) continue;
    const a = anchorOf(inst.anchor);
    if (!a) continue;
    const n = bubbleAt.get(inst.anchor) || 0; bubbleAt.set(inst.anchor, n + 1);
    const dx = a.side === 'left' ? -1 : 1;
    const x = a.x + dx * (26 + n * 24), y = a.y - (a.side === 'left' ? 28 : 40);
    o.push(`<path class="ldr-i" d="M${a.x},${a.y} L${x},${y + 10}"/>`);
    const flowId = (flows.find(f => (f.instrument_ids || []).includes(inst.id)) || {}).id;
    bubble(inst, x, y, flowId);
    placed.add(inst.id);
  }
  for (const r of routes) {
    const f = r.flow;
    for (const id of f.instrument_ids || []) {
      if (placed.has(id)) continue;
      const inst = instById.get(id);
      if (!inst || !r.slot) continue;
      placed.add(id);
      const left = r.fromLeft, x = left ? K.leftTerm + 26 : K.rightTerm - 26, y = r.slot.y + 18;
      bubble(inst, x, y, f.id);
      o.push(`<text class="offsheet fine" x="${left ? x + 14 : x - 14}" y="${y + 3}" text-anchor="${left ? 'start' : 'end'}">off-sheet: ${esc2(inst.location || '')}</text>`);
    }
  }
  o.push(`</g>`);

  /* ---------- notes: what the plan does not say ---------- */
  o.push(`<g data-layer="notes" class="layer">`);
  for (const n of notes) {
    o.push(`<g class="note" ${n.flow ? `data-flow="${n.flow}"` : ''}><rect x="${n.x}" y="${n.y}" width="${n.w}" height="16" rx="2"/><text x="${n.x + 6}" y="${n.y + 11.5}">${esc2(n.text)}</text></g>`);
  }
  o.push(`</g>`);

  /* ---------- findings: at the anchor of the finding's stream, else on the unit ---------- */
  o.push(`<g data-layer="findings" class="layer finds">`);
  const taken = [];
  audit.findings.forEach((f, i) => {
    if (!(f.nodes || []).some(id => members.includes(id))) return;
    let ax = null, ay = null;
    const fl = (f.flows || []).map(id => routes.find(r => r.flow.id === id)).find(Boolean);
    if (fl) { const m = polyMid(fl.drawn, 0.4); ax = m.x; ay = m.y; }
    else if (f.nodes[0] === kiln.id) { ax = axis(0.5).x; ay = axis(0.5).y - K.kilnR; }
    else { ax = (K.coolX0 + K.coolX1) / 2; ay = K.coolTop; }
    let mx = ax + 26, my = ay - 34;
    while (taken.some(t => Math.abs(t.x - mx) < 26 && Math.abs(t.y - my) < 22)) mx += 26;
    taken.push({ x: mx, y: my });
    const hex = [];
    for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 90); hex.push(`${(mx + 11 * Math.cos(a)).toFixed(1)},${(my + 11 * Math.sin(a)).toFixed(1)}`); }
    o.push(`<g class="find tier-${RANK[f.severity].tier}" data-find="${i}"><path class="ldr-halo" d="M${ax},${ay} L${mx},${my}"/><path class="ldr" d="M${ax},${ay} L${mx},${my}"/>` +
           `<path class="hexh" d="M${hex.join(' L')} Z"/><path class="hex" d="M${hex.join(' L')} Z"/><text x="${mx}" y="${my + 3.4}">${i + 1}</text>` +
           `<title>${esc2(RANK[f.severity].word + ' — ' + f.title)}</title></g>`);
  });
  o.push(`</g>`);

  /* ---------- callout back to sheet 01 and the title block ---------- */
  o.push(`<g class="callout" data-sheet="01" tabindex="0"><circle cx="1330" cy="${K.exitY}" r="12"/><line x1="1318" y1="${K.exitY}" x2="1342" y2="${K.exitY}"/>` +
         `<text x="1330" y="${K.exitY - 2}">A</text><text class="cs" x="1330" y="${K.exitY + 9}">01</text>` +
         `<text class="ctext" x="1312" y="${K.exitY + 4}" text-anchor="end">INSTALLATION SHEET</text><title>Back to sheet 01</title></g>`);

  const inst = model.installation;
  const tbX = 1040, tbY = K.H - K.FRAME - 60, tbW = K.W - K.FRAME - tbX, tbH = 60;
  o.push(`<g class="titleblock" transform="translate(${tbX},${tbY})"><rect x="0" y="0" width="${tbW}" height="${tbH}"/>` +
    `<line x1="0" y1="20" x2="${tbW}" y2="20"/><line x1="${tbW - 70}" y1="0" x2="${tbW - 70}" y2="${tbH}"/>` +
    `<text class="t-name" x="8" y="14">${esc2(inst.name)}</text>` +
    `<text class="t-k" x="8" y="33">SHEET</text><text class="t-v" x="8" y="46">02 — KILN SYSTEM, ELEVATION</text>` +
    `<text class="t-note" x="8" y="${tbH - 5}">Generated from monitoring plan data. Template geometry; not an as-built drawing. Ghosted parts are not stated in the plan.</text>` +
    `<text class="t-k" x="${tbW - 62}" y="33">NO.</text><text class="t-big" x="${tbW - 35}" y="${tbH - 10}" text-anchor="middle">02</text></g>`);

  o.push(`</svg>`);
  return { svg: o.join('\n'), parts, anchors, members, flows: flows.map(f => f.id), notes };
}
</script>
<script>/* The drawing set: which sheet is open, how it is navigated, and what a detail sheet
   adds over the plant sheet — viewBox pan and zoom, layer toggles, hover trace of a
   stream across every element that renders it, and click-to-inspect template parts.

   Sheet 01 keeps its own zoom (scaled width/height, page scrolls). Sheet 02 zooms
   by viewBox inside a fixed viewport, so the drawing pans like a sheet on a table. */

let SHEET = '01';
let SHEET2 = null;          // result of renderKilnSheet for the current model
let VB = null;              // current viewBox of the open sheet {x, y, w, h}
let DIMS = { W: 1, H: 1 };  // native size of the open sheet
let FIT_SCALE = 1;          // scale at which the whole sheet fits the viewport; the readout's 100 %
let ANIM = null;
const LAYERS = ['material', 'fuel', 'gas', 'energy', 'instruments', 'boundary', 'notes', 'findings'];
const LAYER_LABEL = { material: 'MATERIAL', fuel: 'FUEL', gas: 'GAS', energy: 'ENERGY', instruments: 'INSTRUMENTS', boundary: 'BOUNDARY', notes: 'NOT STATED', findings: 'FINDINGS' };
let LAYER_ON = Object.fromEntries(LAYERS.map(l => [l, true]));

function sheetsAvailable() {
  return MODEL && MODEL.nodes.some(n => n.detail && n.detail.template === 'kiln_system');
}

function renderSheetStrip() {
  const host = document.getElementById('sheets');
  if (!host) return;
  const two = sheetsAvailable();
  host.innerHTML =
    `<button class="sheetbtn" data-sheet="01" aria-pressed="${SHEET === '01'}"><span class="sn">01</span><span class="st">INSTALLATION</span></button>` +
    (two ? `<button class="sheetbtn" data-sheet="02" aria-pressed="${SHEET === '02'}"><span class="sn">02</span><span class="st">KILN SYSTEM</span></button>` : '');
  host.querySelectorAll('.sheetbtn').forEach(b => b.addEventListener('click', () => openSheet(b.dataset.sheet)));
  const lay = document.getElementById('layers');
  if (lay) {
    const allOn = LAYERS.every(l => LAYER_ON[l]);
    lay.innerHTML =
      `<button class="laybtn layall" id="layer-all" title="${allOn ? 'Hide every layer' : 'Show every layer'}">${allOn ? 'NONE' : 'ALL'}</button>` +
      LAYERS.map(l => `<button class="laybtn" data-layer="${l}" aria-pressed="${LAYER_ON[l]}">${LAYER_LABEL[l]}</button>`).join('');
    const save = () => { try { localStorage.setItem('bp.layers', JSON.stringify(LAYER_ON)); } catch (e) {} };
    lay.querySelectorAll('.laybtn[data-layer]').forEach(b => b.addEventListener('click', () => {
      LAYER_ON[b.dataset.layer] = !LAYER_ON[b.dataset.layer];
      save(); applyLayers(); renderSheetStrip();
    }));
    /* one button, two states: it always offers the opposite of where the layers are */
    lay.querySelector('#layer-all').addEventListener('click', () => {
      const on = !LAYERS.every(l => LAYER_ON[l]);
      LAYERS.forEach(l => { LAYER_ON[l] = on; });
      save(); applyLayers(); renderSheetStrip();
    });
  }
}

function applyLayers() {
  document.querySelectorAll('#diagram [data-layer]').forEach(g => {
    g.classList.toggle('layer-off', LAYER_ON[g.dataset.layer] === false);
  });
}

/* Open a sheet. Sheet 02 is a cut, not a fly-through: two sheets are two pieces of
   paper, and a camera move between them would assert a continuity that is not there. */
function openSheet(id) {
  if (id === '02' && !sheetsAvailable()) id = '01';
  SHEET = id;
  try { localStorage.setItem('bp.sheet', id); } catch (e) {}
  const host = document.getElementById('diagram');
  if (id === '01') {
    DIMS = { W: LAY.width + FRAME_PAD * 2, H: LAY.height + FRAME_PAD * 2 };
    host.innerHTML = render(MODEL, AUDIT, LAY);
  } else {
    SHEET2 = renderKilnSheet(MODEL, AUDIT);
    DIMS = { W: KS.W, H: KS.H };
    host.innerHTML = SHEET2.svg;
  }
  bindSheetEvents();
  bindPanZoom();
  applyLayers();
  applyProcessFilter();
  fitSheet();
  renderSheetStrip();
  markStreamRows();
  document.body.classList.toggle('on-sheet2', id === '02');
  renderDetail(null);
}

function markStreamRows() {
  const on = SHEET === '02' && SHEET2 ? new Set(SHEET2.flows) : null;
  document.querySelectorAll('[data-streamrow]').forEach(tr => tr.classList.toggle('off-sheet', !!on && !on.has(tr.dataset.streamrow)));
}

/* Event wiring shared by both sheets: nodes select, findings pick, callouts navigate. */
function bindSheetEvents() {
  document.querySelectorAll('#diagram [data-node]').forEach(g => {
    g.addEventListener('click', () => selectNode(g.dataset.node));
    g.addEventListener('keydown', e => { if (e.key === 'Enter') selectNode(g.dataset.node); });
  });
  document.querySelectorAll('#diagram [data-find]').forEach(g => g.addEventListener('click', () => pickFinding(+g.dataset.find)));
  document.querySelectorAll('#diagram .callout').forEach(g => {
    const go = () => openSheet(g.dataset.sheet);
    g.addEventListener('click', e => { e.stopPropagation(); go(); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}

/* Drag to pan, wheel to zoom about the cursor, double-click to fly in, hover to trace,
   click to inspect. The same on every sheet: an affordance on one belongs to its sibling. */
function bindPanZoom() {
  const svg = document.getElementById('canvas');
  if (!svg) return;
  VB = { x: 0, y: 0, w: DIMS.W, h: DIMS.H };
  setViewBox(VB);

  /* hover trace: every element carrying the same stream id lights together */
  svg.addEventListener('pointerover', e => {
    const el = e.target.closest('[data-flow]');
    if (!el) return;
    traceFlow(el.dataset.flow);
  });
  svg.addEventListener('pointerout', e => {
    const el = e.target.closest('[data-flow]');
    if (!el) return;
    const to = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-flow]') : null;
    if (to && to.dataset.flow === el.dataset.flow) return;
    traceFlow(null);
  });
  svg.querySelectorAll('[data-flow]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    litFlow(el.dataset.flow);
    const f = MODEL.flows.find(x => x.id === el.dataset.flow);
    if (f) renderFlowDetail(f);
  }));
  svg.querySelectorAll('[data-part]').forEach(el => {
    const pick = () => selectPart(el.dataset.part);
    el.addEventListener('click', e => { e.stopPropagation(); pick(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') pick(); });
  });
  svg.querySelectorAll('[data-inst]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const inst = (MODEL.instruments || []).find(i => i.id === el.dataset.inst);
    if (inst) renderInstrumentDetail(inst);
  }));

  /* pan by drag, zoom by wheel about the cursor */
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, vb: { ...VB }, moved: false };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    const k = VB.w / r.width;
    const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k;
    if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
    VB = { x: drag.vb.x - dx, y: drag.vb.y - dy, w: drag.vb.w, h: drag.vb.h };
    setViewBox(VB);
  });
  const end = e => { if (drag && drag.moved) svg.classList.add('dragged'); drag = null; setTimeout(() => svg.classList.remove('dragged'), 0); };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', e => { if (svg.classList.contains('dragged')) e.stopPropagation(); }, true);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const px = VB.x + (e.clientX - r.left) / r.width * VB.w;
    const py = VB.y + (e.clientY - r.top) / r.height * VB.h;
    const f = Math.exp(e.deltaY * 0.0016);
    zoomAbout(px, py, f);
  }, { passive: false });
  svg.addEventListener('dblclick', e => {
    const r = svg.getBoundingClientRect();
    const px = VB.x + (e.clientX - r.left) / r.width * VB.w;
    const py = VB.y + (e.clientY - r.top) / r.height * VB.h;
    flyTo({ x: px - VB.w / 4, y: py - VB.h / 4, w: VB.w / 2, h: VB.h / 2 });
  });
}

function zoomAbout(px, py, f) {
  const w = Math.min(DIMS.W * 1.6, Math.max(DIMS.W / 8, VB.w * f));
  const k = w / VB.w;
  VB = { x: px - (px - VB.x) * k, y: py - (py - VB.y) * k, w, h: VB.h * k };
  setViewBox(VB);
}

function setViewBox(vb) {
  const svg = document.getElementById('canvas');
  if (!svg) return;
  svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
  const scale = Math.min(DIMS.W / vb.w, DIMS.H / vb.h) / (FIT_SCALE || 1);
  /* semantic zoom: fine annotation only past a threshold, tags and flags stay */
  svg.classList.toggle('lod-far', scale < 0.8);
  svg.classList.toggle('lod-near', scale >= 2.2);
  const z = document.getElementById('zoom-level');
  if (z) z.textContent = `${Math.round(scale * 100)}%`;
}

/* Van Wijk-style feel on the cheap: ease the viewBox, zooming out a touch on long pans. */
function flyTo(target, ms = 520) {
  if (ANIM) cancelAnimationFrame(ANIM);
  const from = { ...VB }, t0 = performance.now();
  const dist = Math.hypot(target.x + target.w / 2 - from.x - from.w / 2, target.y + target.h / 2 - from.y - from.h / 2);
  const bulge = Math.min(0.35, dist / DIMS.W * 0.5);
  const step = now => {
    const u = Math.min(1, (now - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const w = from.w + (target.w - from.w) * e, h = from.h + (target.h - from.h) * e;
    const sw = w * (1 + bulge * Math.sin(Math.PI * u)), sh = h * (1 + bulge * Math.sin(Math.PI * u));
    const cx = from.x + from.w / 2 + (target.x + target.w / 2 - from.x - from.w / 2) * e;
    const cy = from.y + from.h / 2 + (target.y + target.h / 2 - from.y - from.h / 2) * e;
    VB = { x: cx - sw / 2, y: cy - sh / 2, w: sw, h: sh };
    setViewBox(VB);
    if (u < 1) ANIM = requestAnimationFrame(step); else ANIM = null;
  };
  ANIM = requestAnimationFrame(step);
}

function fitSheet() {
  const host = document.getElementById('diagram');
  const svg = document.getElementById('canvas');
  if (!svg) return;
  /* The viewport is the box the reader can actually see: from the top of the diagram
     area to the stream table (or the window bottom). The whole sheet fits inside it,
     letterboxed by widening the viewBox, so nothing is cut off and the page never scrolls. */
  let w = host.clientWidth - 28;
  if (w < 200) w = Math.max(320, (host.getBoundingClientRect().width || innerWidth * 0.5) - 28);
  const streams = document.getElementById('streams');
  const streamsH = streams && getComputedStyle(streams).display !== 'none' ? streams.getBoundingClientRect().height : 0;
  const top = host.getBoundingClientRect().top + 14;
  let h = innerHeight - top - streamsH - 12;
  if (h < 160) h = Math.round(w * DIMS.H / DIMS.W);
  h = Math.min(h, Math.round(w * DIMS.H / DIMS.W) * 2);
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  const boxAspect = w / h, sheetAspect = DIMS.W / DIMS.H;
  if (boxAspect > sheetAspect) {
    const vw = DIMS.H * boxAspect;
    VB = { x: -(vw - DIMS.W) / 2, y: 0, w: vw, h: DIMS.H };
  } else {
    const vh = DIMS.W / boxAspect;
    VB = { x: 0, y: -(vh - DIMS.H) / 2, w: DIMS.W, h: vh };
  }
  FIT_SCALE = Math.min(DIMS.W / VB.w, DIMS.H / VB.h);
  setViewBox(VB);
}

function sheetZoom(f) {
  zoomAbout(VB.x + VB.w / 2, VB.y + VB.h / 2, f);
}

/* Fly the view to an element on the open sheet (the plan panel uses this on click). */
function flyToElement(el) {
  const svg = document.getElementById('canvas');
  if (!el || !svg || !el.getBBox) return;
  const b = el.getBBox();
  const ctm = el.getScreenCTM(), root = svg.getScreenCTM();
  if (!ctm || !root) return;
  /* element box into sheet units (svg user space), then a generous margin so context stays visible */
  const m = root.inverse().multiply(ctm);
  const p = svg.createSVGPoint();
  const pts = [[b.x, b.y], [b.x + b.width, b.y + b.height]].map(([x, y]) => { p.x = x; p.y = y; return p.matrixTransform(m); });
  const x0 = Math.min(pts[0].x, pts[1].x), y0 = Math.min(pts[0].y, pts[1].y);
  const w = Math.abs(pts[1].x - pts[0].x), h = Math.abs(pts[1].y - pts[0].y);
  /* land at about 135 % of the fitted view: close enough to read, far enough to keep context */
  const fitW = DIMS.W / (FIT_SCALE || 1);
  const tw = Math.max(fitW / 1.35, w * 1.6), th = tw * (svg.clientHeight || DIMS.H) / (svg.clientWidth || DIMS.W);
  flyTo({ x: x0 + w / 2 - tw / 2, y: y0 + h / 2 - th / 2, w: tw, h: th });
}

function traceFlow(id) {
  const svg = document.getElementById('canvas');
  if (!svg) return;
  svg.classList.toggle('tracing', !!id);
  svg.querySelectorAll('[data-flow]').forEach(el => el.classList.toggle('trace', !!id && el.dataset.flow === id));
  document.querySelectorAll('[data-streamrow]').forEach(tr => tr.classList.toggle('hover', !!id && tr.dataset.streamrow === id));
}

/* ---------- inspect: parts, streams, instruments on the detail sheet ---------- */

function selectPart(id) {
  document.querySelectorAll('#diagram [data-part]').forEach(g => g.classList.toggle('lit', g.dataset.part === id));
  document.querySelectorAll('#diagram [data-node]').forEach(g => g.classList.remove('lit'));
  const p = (SHEET2 && SHEET2.parts.find(x => x.id === id)) || null;
  if (!p) return;
  renderPartDetail(p);
}

function renderPartDetail(p) {
  const el = document.getElementById('detail');
  const kiln = MODEL.nodes.find(n => n.detail && n.detail.template === 'kiln_system');
  const cooler = MODEL.nodes.find(n => n.detail && n.detail.template === 'grate_cooler') || MODEL.nodes.find(n => n.symbol === 'cooler');
  const owner = ['cooler', 'crusher', 'cooler_vent', 'heat_recovery'].includes(p.id) ? cooler : kiln;
  const d = (owner && owner.detail) || {};
  const rows = [];
  const add = (k, v, raw) => { if (v !== undefined && v !== null && v !== '') rows.push([k, v, raw]); };
  add('Part of', owner ? `${owner.name}${owner.equipment_tag ? ` (${owner.equipment_tag})` : ''}` : '—');
  add('What it is', p.what);
  if (p.typical) add('Plan basis', `<span class="gapword">Typical arrangement, not from the plan.</span> The plan does not describe this part; it is drawn so the line reads as a whole. Nothing on it is a plan claim.`, true);
  else if (d.source && d.source.quote) add('Plan basis', `${d.source.clause ? `<code>${esc(d.source.clause)}</code> ` : ''}<span class="quote">“${esc(d.source.quote)}”</span>`, true);
  else add('Plan basis', p.stated || 'stated in the plan');
  /* which streams touch this part: by anchor name convention */
  const anchorsOfPart = {
    elevator: ['feed_elevator'], c1: ['feed_inlet'], riser: ['preheater_exit', 'feed_inlet'], calciner: ['calciner_fuel', 'tertiary_air', 'calciner'],
    kiln_inlet: ['kiln_inlet'], bypass: ['bypass'], kiln: ['kiln_discharge'], drive: ['kiln_drive'], burner: ['main_burner'], hood: ['hood'],
    cooler: ['cooler_inlet', 'cooler_discharge'], crusher: ['cooler_discharge'], cooler_vent: ['cooler_vent'], heat_recovery: ['heat_recovery'], tad: ['tertiary_air']
  }[p.id] || [];
  const list = v => v == null ? [] : (Array.isArray(v) ? v : [v]);
  const streams = MODEL.flows.filter(f => f.attach && [...list(f.attach.to), ...list(f.attach.from)].some(a => anchorsOfPart.includes(a)));
  if (streams.length) add('Streams here', streams.map(f => `<span class="mono">${f.stream_no ?? ''}</span> ${esc(f.label || f.kind)}${f.carbon_t != null ? ` — ${fmt(f.carbon_t)} t C` : ' — <span class="gapword">carbon not determined</span>'}`).join('<br>'), true);
  const insts = (MODEL.instruments || []).filter(i => anchorsOfPart.includes(i.anchor));
  if (insts.length) add('Instruments here', insts.map(i => `<b>${isaCode(i)}</b> ${esc(i.id)} — ${esc(i.name)}, ${esc(i.location || '')}`).join('<br>'), true);
  const notes = (SHEET2 && SHEET2.notes.filter(n => !n.flow)) || [];
  if (p.typical && notes.length && ['tower', 'calciner', 'bypass', 'cooler'].includes(p.id)) {
    const n = notes.find(x => x.text.toLowerCase().includes(p.id === 'tower' ? 'stage' : p.id));
    if (n) add('Marked on sheet', n.text);
  }
  el.innerHTML = `<h3>${esc(p.name)}</h3><dl>` + rows.map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join('') + `</dl>`;
}

function renderFlowDetail(f) {
  const el = document.getElementById('detail');
  const byId = new Map(MODEL.nodes.map(n => [n.id, n]));
  const rows = [];
  const add = (k, v, raw) => { if (v !== undefined && v !== null && v !== '') rows.push([k, v, raw]); };
  add('Stream', `${f.stream_no ?? ''} — ${f.label || f.kind}`);

    if (froms.length) add('Leaves at', froms.map(a => a.replace(/_/g, ' ')).join(', '));

  const insts = (f.instrument_ids || []).map(i => (MODEL.instruments || []).find(x => x.id === i)).filter(Boolean);
  add('Instruments', insts.length ? insts.map(i => `<b>${isaCode(i)}</b> ${esc(i.id)} — ${esc(i.name)}, ${esc(i.location || '')}${i.anchor ? '' : ' <span class="dim">(off-sheet)</span>'}`).join('<br>') : 'none', true);
  if (f.source && f.source.quote) add('Plan source', `${f.source.clause ? `<code>${esc(f.source.clause)}</code> ` : ''}<span class="quote">“${esc(f.source.quote)}”</span>`, true);
  el.innerHTML = `<h3>Stream ${f.stream_no ?? ''}</h3><dl>` + rows.map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join('') + `</dl>`;
}

function renderInstrumentDetail(i) {
  const el = document.getElementById('detail');
  const rows = [];
  const add = (k, v, raw) => { if (v !== undefined && v !== null && v !== '') rows.push([k, v, raw]); };
  add('Code', `${isaCode(i)} ${i.id}`);
  add('Type', i.type);
  add('Location', i.location);
  add('Measures', i.measures);
  add('Uncertainty', i.uncertainty_pct != null ? `±${i.uncertainty_pct} %` : null);
  add('Calibration', `${i.last_calibration || 'unknown'}${i.calibration_interval ? ` (${i.calibration_interval.toLowerCase()})` : ''}`);
  add('Mounted at', i.anchor ? i.anchor.replace(/_/g, ' ') : 'off this sheet');
  const streams = MODEL.flows.filter(f => (f.instrument_ids || []).includes(i.id));
  if (streams.length) add('Streams', streams.map(f => `${f.stream_no ?? ''} ${esc(f.label || f.kind)}`).join(', '));
  if (i.source && i.source.quote) add('Plan source', `${i.source.clause ? `<code>${esc(i.source.clause)}</code> ` : ''}<span class="quote">“${esc(i.source.quote)}”</span>`, true);
  el.innerHTML = `<h3>${esc(i.name)}</h3><dl>` + rows.map(([k, v, raw]) => `<dt>${esc(k)}</dt><dd>${raw ? v : esc(v)}</dd>`).join('') + `</dl>`;
}

function initSheets() {
  try { const v = JSON.parse(localStorage.getItem('bp.layers') || 'null'); if (v && typeof v === 'object') LAYER_ON = { ...LAYER_ON, ...v }; } catch (e) {}
  let s = '01';
  try { s = localStorage.getItem('bp.sheet') || '01'; } catch (e) {}
  return s;
}
